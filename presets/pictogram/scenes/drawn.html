<template>
  <!-- register: drawn (preset pictogram: COUNT GRID, many identical pictograms and one in the accent colour)  |  job: __JOB__  |  hero: __HERO__ -->
  <!-- Data told by repetition: the grid shows "one of many" without a chart. COLS x ROWS and HOT (which one is lit) are
       set in the script; swap ICON for any pictogram in presets/pictogram/blocks.html (keep classes s / f). A number in
       the title must be spoken. Mark "hit" = the others fade back and the lit one jumps out. Teal field by default. -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #__ID__-band { top: 180px; height: 400px; }
    #__ID__-title { top: 220px; }
    #__ID__-grid { position: absolute; left: 80px; top: 640px; width: 920px; height: 500px; }
    #__ID__-grid > svg { position: absolute; }
    #__ID__-halo { position: absolute; border-radius: 50%; border: 10px solid var(--accent); }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div id="__ID__-world" class="pg-world pg-teal">
      <div id="__ID__-tiles" class="pg-tiles" data-layout-allow-overflow></div>
      <div id="__ID__-band" class="pg-band"></div>
      <div id="__ID__-title" class="pg-title" data-safe="text">__HERO__</div>
      <div id="__ID__-grid"><div id="__ID__-halo"></div></div>
    </div>
  </div>
  <script>
    const C = /*@cues*/{}/*@end*/;
    const tl = gsap.timeline({ paused: true });
    const D = C.dur ?? 2;
    const COLS = 7, ROWS = 4, HOT = 17;
    const ICON = '<circle class="f" cx="50" cy="20" r="13" /><path class="s" stroke-width="16" d="M50 42 L50 78 M50 48 L32 70 M50 48 L68 70 M50 78 L38 116 M50 78 L62 116" />';
    const tiles = (sel) => {
      const box = document.querySelector(sel); if (!box) return [];
      if (!box.dataset.done) {
        box.dataset.done = "1";
        let h = [..."__ID__"].reduce((a, c) => (a * 31 + c.charCodeAt(0)) & 0xffff, 7); const out = [];
        for (let i = 0; i < 104; i++) { h = (h * 1103515245 + 12345) & 0x7fffffff; out.push(`<i class="t${(h >> 9) % 8}"></i>`); }
        box.innerHTML = out.join("");
      }
      return box.children;
    };
    const split = (el) => {
      if (!el || el.dataset.split) return;
      el.dataset.split = "1";
      const s = el.innerHTML.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); const tok = [];
      s.replace(/<em>([\s\S]*?)<\/em>|([^<]+)|<[^>]*>/g, (m, hot, cold) => { if (hot != null) tok.push([hot, true]); else if (cold != null) tok.push([cold, false]); return ""; });
      const out = [];
      for (const [txt, hot] of tok) for (const w of txt.split(/\s+/).filter(Boolean)) out.push(`<span class="w${hot ? " k" : ""}" data-layout-allow-overflow><b>${w}</b></span>`);
      el.innerHTML = out.join(" ");
      if (!el.querySelector(".k")) el.querySelector(".w:last-child")?.classList.add("k");
      const longest = Math.max(...[...el.querySelectorAll(".w")].map((w) => w.textContent.length));
      el.style.fontSize = Math.min(160, Math.floor(920 / (0.8 * longest))) + "px";
    };
    const grid = document.querySelector("#__ID__-grid");
    if (grid && !grid.dataset.done) {
      grid.dataset.done = "1";
      const cw = 920 / COLS, ch = 500 / ROWS, s = Math.min(cw, ch * 0.8) * 0.9;
      for (let i = 0; i < COLS * ROWS; i++) {
        const x = (i % COLS) * cw + (cw - s) / 2, y = Math.floor(i / COLS) * ch + (ch - s * 1.2) / 2;
        grid.insertAdjacentHTML("beforeend", `<svg id="__ID__-p${i}" class="pg-ico${i === HOT ? " hot" : ""}" viewBox="0 0 100 120" style="left:${x}px;top:${y}px;width:${s}px;height:${s * 1.2}px">${ICON}</svg>`);
      }
      const halo = document.querySelector("#__ID__-halo"), r = s * 0.95;
      Object.assign(halo.style, { left: (HOT % COLS) * cw + cw / 2 - r + "px", top: Math.floor(HOT / COLS) * ch + ch / 2 - r + "px", width: 2 * r + "px", height: 2 * r + "px" });
    }
    const T = tiles("#__ID__-tiles");
    split(document.querySelector("#__ID__-title"));
    const words = document.querySelectorAll("#__ID__-title .w > b");
    const people = document.querySelectorAll("#__ID__-grid > svg");
    const others = document.querySelectorAll("#__ID__-grid > svg:not(.hot)");
    tl.fromTo(T, { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out", stagger: { grid: [13, 8], from: "end", amount: 0.22 } }, 0);
    tl.fromTo("#__ID__-tiles", { y: 0 }, { y: -180, duration: D, ease: "none" }, 0);
    tl.fromTo(words, { yPercent: 110 }, { yPercent: 0, duration: 0.22, ease: "power3.out", stagger: Math.min(0.05, 0.2 / Math.max(1, words.length - 1)) }, 0.03);
    // pictograms pop in row by row (micro cascade, under a third of a second in all)
    tl.fromTo(people, { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(2)", transformOrigin: "50% 100%", stagger: { grid: [ROWS, COLS], from: "start", amount: 0.3 } }, 0.08);
    const H = C.hit ?? Math.min(0.8, D * 0.5);
    tl.fromTo(others, { opacity: 1 }, { opacity: 0.32, duration: 0.2, ease: "power2.out", immediateRender: false }, H);
    tl.fromTo("#__ID__-grid > svg.hot", { scale: 1 }, { scale: 1.3, duration: 0.24, ease: "back.out(2.6)", transformOrigin: "50% 60%", immediateRender: false }, H);
    tl.fromTo("#__ID__-halo", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(1.8)" }, H);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
