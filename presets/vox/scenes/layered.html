<template>
  <!-- stub: layered (preset vox, "adegan berlapis"; beat: "register": "footage", "stub": "layered")  |  job: __JOB__  |  hero: __HERO__
       Layers, back to front: plate (bg photo or clip) → word behind the subject → subject cut-out → foreground cut-out
       → front word / scrawl → grain + vignette. Each layer rides the camera at its own depth (parallax).
       Images: assets/layers/__ID__-bg.jpg, __ID__-subj.png, __ID__-fg.png (cut-outs from green screen: node tools/cutout.mjs). -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0E0D0C; }
    #__ID__-world { position: absolute; inset: 0; }
    #__ID__-world > .vox-layer { position: absolute; inset: 0; }
    #__ID__-bg > * { position: absolute; left: -110px; top: -200px; width: 1300px; height: 2320px; object-fit: cover; }
    #__ID__-subj > * { position: absolute; left: 230px; top: 470px; width: 620px; height: 860px; object-fit: contain; object-position: bottom; }
    #__ID__-fg > * { position: absolute; left: -80px; top: 1080px; width: 560px; height: 760px; object-fit: contain; object-position: bottom left; }
    .__ID__-ph { display: grid; place-items: center; font: 600 32px var(--font-mono); color: rgba(255,255,255,.55); }
    #__ID__-bg .__ID__-ph { background: linear-gradient(#5b5853, #2a2826); }
    #__ID__-subj .__ID__-ph { background: rgba(255,255,255,.12); border: 3px dashed rgba(255,255,255,.4); }
    #__ID__-fg .__ID__-ph { background: rgba(0,0,0,.35); border: 3px dashed rgba(255,255,255,.25); }
    #__ID__-back { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
    #__ID__-backword { font-size: 190px; color: rgba(255,255,255,.92); }
    #__ID__-front { position: absolute; left: 600px; top: 900px; transform: rotate(-4deg); }
    #__ID__-hero { font-size: 64px; }
    #__ID__-ring { position: absolute; left: 520px; top: 830px; width: 460px; height: 230px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div id="__ID__-hand" class="vox-hand" data-layout-allow-overflow>
      <div id="__ID__-world" class="vox-scene">
        <!-- plate: <img src="assets/layers/__ID__-bg.jpg" class="vox-doc"> or <video src="assets/footage/__ID__.mp4" class="vox-doc" muted playsinline></video> -->
        <div id="__ID__-bg" class="vox-layer"><div class="__ID__-ph vox-doc">LATAR</div></div>
        <div id="__ID__-backl" class="vox-layer"><div id="__ID__-back"><span id="__ID__-backword" class="vox-word big" data-safe="text" data-layout-allow-occlusion style="top:330px">__HERO__</span></div></div>
        <!-- subject: <img src="assets/layers/__ID__-subj.png" class="vox-doc"> -->
        <div id="__ID__-subj" class="vox-layer"><div class="__ID__-ph vox-doc">SUBJEK</div></div>
        <!-- foreground: <img src="assets/layers/__ID__-fg.png" class="vox-doc"> (blurred a little: class="vox-doc vox-near") -->
        <div id="__ID__-fg" class="vox-layer"><div class="__ID__-ph">DEPAN</div></div>
        <div id="__ID__-frontl" class="vox-layer">
          <div id="__ID__-front"><span id="__ID__-hero" class="vox-word" data-safe="text" style="top:900px">__HERO__</span></div>
          <svg id="__ID__-ring" class="vox-scrawl" viewBox="0 0 460 230"><path id="__ID__-ringp" d="M 300 30 C 170 0 30 40 26 115 C 22 190 190 222 320 200 C 430 182 455 110 400 62 C 360 30 270 22 210 34" pathLength="1"/></svg>
        </div>
      </div>
    </div>
    <div class="vox-vignette"></div>
    <div id="__ID__-grain" class="vox-grain" data-layout-allow-overflow></div>
  </div>
  <script>
    const C = /*@cues*/{}/*@end*/;
    const tl = gsap.timeline({ paused: true });
    // Things arrive one at a time, stop-motion (steps), never together.
    tl.fromTo("#__ID__-subj", { y: 60 }, { y: 0, duration: 0.24, ease: "steps(4)" }, 0.05);
    tl.fromTo("#__ID__-fg", { y: 120 }, { y: 0, duration: 0.2, ease: "steps(3)" }, 0.3);
    tl.fromTo("#__ID__-backword", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "steps(5)" }, 0.12);
    tl.fromTo("#__ID__-front", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "steps(4)" }, C.slam ?? 0.6);
    tl.fromTo("#__ID__-ringp", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "steps(8)" }, (C.slam ?? 0.6) + 0.15);

    // Parallax camera. keys [t, fx, fy, scale, rotateDeg, ease]: world point (fx, fy) lands at screen (540, 760).
    // Each layer follows at its depth d (0 = fixed, 1 = the subject plane, > 1 = nearer than the subject):
    // focus 540 + (fx - 540)·d, scale 1 + (s - 1)·d. Moves are quantised to 12 fps (on twos), like stop-motion.
    const on12 = (name, dur) => { const f = gsap.parseEase(name), n = Math.max(1, Math.round(dur * 12)); return (p) => Math.round(f(p) * n) / n; };
    const par = (layers, keys) => {
      const st = ([, fx, fy, s = 1, r = 0], d) => {
        const X = 540 + (fx - 540) * d, Y = 760 + (fy - 760) * d, S = 1 + (s - 1) * d, a = r * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
        return { x: 540 - S * (c * X - n * Y), y: 760 - S * (n * X + c * Y), scale: S, rotate: r };
      };
      for (const [sel, d] of layers) {
        tl.set(sel, { transformOrigin: "0 0", ...st(keys[0], d) }, 0);
        for (let i = 1, t0 = 0; i < keys.length; i++) {
          const t1 = Math.min(C.dur, Math.max(t0 + 0.1, keys[i][0]));
          tl.fromTo(sel, st(keys[i - 1], d), { ...st(keys[i], d), duration: t1 - t0, ease: on12(keys[i][5] || "sine.inOut", t1 - t0), immediateRender: false }, t0);
          t0 = t1;
        }
      }
    };
    par([["#__ID__-bg", 0.35], ["#__ID__-backl", 0.6], ["#__ID__-subj", 1], ["#__ID__-fg", 1.6], ["#__ID__-frontl", 1.1]],
        [[0, 470, 820, 1.04, 0], [C.dur, 610, 740, 1.12, 0.4, "sine.inOut"]]);

    // Hand-held wobble at 6 fps and grain at 12 fps, both from fixed tables (deterministic).
    const HH = [[0, 0, 0], [3, -2, 0.12], [-2, 3, -0.1], [2, 2, 0.06], [-3, -1, -0.12], [1, -3, 0.1], [-1, 2, -0.05], [3, 1, 0.08]];
    for (let t = 0, k = 0; t < C.dur; t += 1 / 6, k++) tl.set("#__ID__-hand", { x: HH[k % 8][0], y: HH[k % 8][1], rotate: HH[k % 8][2] }, t);
    const GR = [[0, 0], [-37, 21], [18, -44], [-9, 33], [42, 8], [-25, -17], [11, 46], [-46, -6], [29, -31], [-14, 12], [35, 39], [-41, 27]];
    for (let t = 0, k = 0; t < C.dur; t += 1 / 12, k++) tl.set("#__ID__-grain", { x: GR[k % 12][0], y: GR[k % 12][1] }, t);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
