<template>
  <!-- register: screen (preset vox; real screenshot off a real device: assets/screens/__ID__.png)  |  job: __JOB__  |  hero: __HERO__ -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
    #__ID__-stage { position: absolute; inset: 0; }
    #__ID__-label { position: absolute; left: 90px; right: 90px; top: 200px; margin: 0; font: 900 84px/1 var(--font-display); color: var(--ink); letter-spacing: -0.02em; }
    #__ID__-cutwrap { position: absolute; left: 230px; top: 400px; width: 620px; height: 700px; transform: rotate(2deg); filter: drop-shadow(10px 14px 0 var(--shadow)); }
    #__ID__-cut { width: 100%; height: 100%; box-sizing: border-box; --edge: var(--card); }
    #__ID__-shot { object-position: top; }
    #__ID__-placeholder { display: grid; place-items: center; font: 600 34px var(--font-mono); color: var(--muted); background: repeating-linear-gradient(45deg, #dedad1 0 20px, #e6e2da 20px 40px); }
    #__ID__-tape1, #__ID__-tape2 { position: absolute; width: 190px; height: 54px; background: rgba(236,226,196,.82); }
    #__ID__-tape1 { left: 190px; top: 380px; transform: rotate(-24deg); }
    #__ID__-tape2 { left: 720px; top: 1060px; transform: rotate(-20deg); }
    #__ID__-ring { position: absolute; left: 200px; top: 600px; width: 680px; height: 220px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div id="__ID__-hand" class="vox-hand" data-layout-allow-overflow><div id="__ID__-world" class="vox-world grid">
    <div id="__ID__-stage">
      <h2 id="__ID__-label" data-safe="text" style="top:200px">__HERO__</h2>
      <div id="__ID__-cutwrap">
        <div id="__ID__-cut" class="vox-cut">
          <!-- Replace the placeholder with: <img id="__ID__-shot" src="assets/screens/__ID__.png" data-var-src="__ID__-shot" alt="" /> (no .vox-copy: real screens stay as they are) -->
          <div id="__ID__-placeholder" class="vox-fill">SCREENSHOT</div>
        </div>
      </div>
      <div id="__ID__-tape1"></div>
      <div id="__ID__-tape2"></div>
      <svg id="__ID__-ring" viewBox="0 0 680 220" fill="none">
        <path id="__ID__-ringp" d="M90 190 C 10 150, 20 40, 220 22 C 430 5, 670 30, 660 115 C 650 195, 420 212, 250 205 C 150 200, 70 185, 110 150" stroke="var(--alert)" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="100 110" stroke-dashoffset="102" />
      </svg>
    </div>
    </div></div>
  </div>
  <script>
    const C = /*@cues*/{}/*@end*/;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#__ID__-cutwrap", { y: 70, rotate: -5 }, { y: 0, rotate: 2, duration: 0.24, ease: "steps(4)" }, 0);
    tl.fromTo(["#__ID__-tape1", "#__ID__-tape2"], { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "steps(1)", stagger: 0.08 }, 0.2);
    tl.fromTo("#__ID__-label", { y: -30 }, { y: 0, duration: 0.16, ease: "steps(3)" }, 0);
    // Circle the row the voice is talking about (move #__ID__-ring onto it).
    tl.fromTo("#__ID__-ringp", { strokeDashoffset: 102 }, { strokeDashoffset: 0, duration: 0.4, ease: "steps(8)" }, C.tap ?? Math.min(1.2, C.dur * 0.5));
    // Camera: world point (fx, fy) lands at screen (540, 760), the middle of the safe band; [t, 540, 760, 1, 0] = layout as drawn.
    // Keys [t, fx, fy, scale, rotateDeg, ease] ease into each other with no holds: pan between elements, push in at the mark, pull out to reveal.
    const cam = (W, keys) => {
      const st = ([, fx, fy, s = 1, r = 0]) => { const a = r * Math.PI / 180, c = Math.cos(a), n = Math.sin(a); return { x: 540 - s * (c * fx - n * fy), y: 760 - s * (n * fx + c * fy), scale: s, rotate: r }; };
      tl.set(W, { transformOrigin: "0 0", ...st(keys[0]) }, 0);
      for (let i = 1, t0 = 0; i < keys.length; i++) {
        const t1 = Math.min(C.dur, Math.max(t0 + 0.1, keys[i][0]));
        tl.fromTo(W, st(keys[i - 1]), { ...st(keys[i]), duration: t1 - t0, ease: keys[i][5] || "sine.inOut", immediateRender: false }, t0);
        t0 = t1;
      }
    };
    cam("#__ID__-world", [[0, 460, 700, 1.06], [0.45, 500, 720, 1.02, 0, "power2.out"], [C.tap ?? C.dur * 0.5, 620, 740, 1.03], [C.dur, 540, 820, 1.08]]);
    // Hand-held: stepped wobble at 6 fps (fixed table, deterministic).
    const HH = [[0, 0, 0], [3, -2, 0.12], [-2, 3, -0.1], [2, 2, 0.06], [-3, -1, -0.12], [1, -3, 0.1], [-1, 2, -0.05], [3, 1, 0.08]];
    for (let t = 0, k = 0; t < C.dur; t += 1 / 6, k++) tl.set("#__ID__-hand", { x: HH[k % 8][0], y: HH[k % 8][1], rotate: HH[k % 8][2] }, t);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
