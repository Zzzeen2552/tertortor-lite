<template>
  <!-- register: type (preset vox: serif + stabilo on paper)  |  job: __JOB__  |  hero: __HERO__ -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
    #__ID__-stage { position: absolute; inset: 0; }
    #__ID__-tapewrap { position: absolute; left: 90px; top: 330px; transform: rotate(-3deg); transform-origin: left center; }
    #__ID__-line { position: absolute; left: 90px; right: 90px; top: 450px; margin: 0; font: 900 132px/0.98 var(--font-display); color: var(--ink); letter-spacing: -0.02em; }
    #__ID__-hl { --hl-x: 0; }
    #__ID__-ring { position: absolute; left: 60px; top: 420px; width: 960px; height: 360px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div id="__ID__-hand" class="vox-hand" data-layout-allow-overflow><div id="__ID__-world" class="vox-world">
    <div id="__ID__-stage">
      <div id="__ID__-tapewrap"><span id="__ID__-tape" class="vox-tape" data-safe="text" style="top:330px">__JOB__</span></div>
      <h1 id="__ID__-line" data-safe="text" style="top:450px"><span id="__ID__-hl" class="vox-marker">__HERO__</span></h1>
      <svg id="__ID__-ring" viewBox="0 0 960 360" fill="none">
        <path id="__ID__-ringp" d="M120 300 C 20 250, 30 90, 260 50 C 520 5, 900 40, 930 170 C 955 290, 640 345, 380 335 C 230 330, 110 300, 150 250" stroke="var(--alert)" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="100 110" stroke-dashoffset="102" />
      </svg>
    </div>
    </div></div>
  </div>
  <script>
    const C = /*@cues*/{}/*@end*/; // beat-local seconds from beats.json marks, written by tools/cues.mjs
    const tl = gsap.timeline({ paused: true });
    // Pasted on in stop-motion; the hero is readable from frame 0, the marker swipe lands on the word mark.
    tl.fromTo("#__ID__-tapewrap", { y: 50, rotate: 4 }, { y: 0, rotate: -3, duration: 0.2, ease: "steps(4)" }, 0);
    tl.fromTo("#__ID__-line", { y: 40, rotate: -1.5 }, { y: 0, rotate: 0, duration: 0.2, ease: "steps(4)" }, 0);
    tl.fromTo("#__ID__-hl", { "--hl-x": 0 }, { "--hl-x": 1, duration: 0.25, ease: "steps(5)" }, C.slam ?? 0.25);
    if (C.tap) tl.fromTo("#__ID__-ringp", { strokeDashoffset: 102 }, { strokeDashoffset: 0, duration: 0.4, ease: "steps(8)" }, C.tap);
    for (let t = 0.5, k = 0; t < C.dur - 0.2; t += 0.25, k++) tl.set("#__ID__-tapewrap", { rotate: k % 2 ? -3 : -3.6 }, t); // boil
    // Camera: world point (fx, fy) lands at screen (540, 760), the middle of the safe band; [t, 540, 760, 1, 0] = layout as drawn.
    // Keys [t, fx, fy, scale, rotateDeg, ease] ease into each other with no holds: pan between elements, push in at the mark, pull out to reveal.
    const cam = (W, keys) => {
      const st = ([, fx, fy, s = 1, r = 0]) => { const a = r * Math.PI / 180, c = Math.cos(a), n = Math.sin(a); return { x: 540 - s * (c * fx - n * fy), y: 760 - s * (n * fx + c * fy), scale: s, rotate: r }; };
      tl.set(W, { transformOrigin: "0 0", ...st(keys[0]) }, 0);
      for (let i = 1, t0 = 0; i < keys.length; i++) {
        const t1 = Math.min(C.dur, Math.max(t0 + 0.1, keys[i][0]));
        tl.fromTo(W, st(keys[i - 1]), { ...st(keys[i]), duration: t1 - t0, ease: keys[i][5] || "sine.inOut", immediateRender: false }, t0);
        t0 = t1;
      }
    };
    cam("#__ID__-world", [[0, 540, 700, 1.08], [0.45, 540, 740, 1.02, 0, "power2.out"], [(C.slam ?? 0.6) - 0.1, 540, 760, 1], [(C.slam ?? 0.6) + 0.2, 540, 700, 1.1, -1, "power3.out"], [C.dur, 545, 700, 1.12, -1.2]]);
    // Hand-held: stepped wobble at 6 fps (fixed table, deterministic).
    const HH = [[0, 0, 0], [3, -2, 0.12], [-2, 3, -0.1], [2, 2, 0.06], [-3, -1, -0.12], [1, -3, 0.1], [-1, 2, -0.05], [3, 1, 0.08]];
    for (let t = 0, k = 0; t < C.dur; t += 1 / 6, k++) tl.set("#__ID__-hand", { x: HH[k % 8][0], y: HH[k % 8][1], rotate: HH[k % 8][2] }, t);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
