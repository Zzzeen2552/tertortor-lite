<!-- Line-Art Cutaway blocks: paste into a scene, prefix ids with the beat id (here __ID__). All drawings use the
     classes of preset.css: l = outline, t = inner line, g = grey face, w = white face, a = THE accent path
     (one per frame), af = accent fill, dash = dotted leader. Give l / t / a paths pathLength 1 and tween
     strokeDashoffset from 1 to 0 to trace them, as the stubs do. -->

<!-- EXPLODED VIEW: three layers of one object drawn as flat slabs, pulled apart along y at mark "split".
     tl.fromTo("#__ID__-L1", { y: 120 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, C.split); and L3 from -120. -->
<svg id="__ID__-exploded" class="lc-draw" viewBox="0 0 900 640" style="left:90px;top:520px;width:900px;height:640px">
  <g id="__ID__-L1"><path class="w" d="M120 120 L640 60 L800 140 L280 200 Z" /><path class="l" d="M120 120 L640 60 L800 140 L280 200 Z M120 120 L120 136 L280 216 L800 156 L800 140" /></g>
  <g id="__ID__-L2"><path class="g" d="M120 300 L640 240 L800 320 L280 380 Z" /><path class="l" d="M120 300 L640 240 L800 320 L280 380 Z" /><path class="t" d="M300 300 L420 286 L470 312 L350 326 Z M520 280 L600 270 L640 290 L560 300 Z" /><path class="a" d="M300 300 L420 286 L470 312" /></g>
  <g id="__ID__-L3"><path class="w" d="M120 480 L640 420 L800 500 L280 560 Z" /><path class="l" d="M120 480 L640 420 L800 500 L280 560 Z M120 480 L120 500 L280 580 L800 520 L800 500" /></g>
  <path class="dash" d="M280 216 L280 300 M800 156 L800 320 M280 380 L280 480 M800 320 L800 500" />
</svg>

  <rect x="200" y="40" width="190" height="80" fill="url(#__ID__-hatch)" /><rect class="l" x="10" y="40" width="380" height="80" />
</svg>
