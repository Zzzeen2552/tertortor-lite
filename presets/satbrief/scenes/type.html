<template>

  <script>
    const C = /*@cues*/{}/*@end*/;
    const tl = gsap.timeline({ paused: true });
    const D = C.dur ?? 2;
    const split = (el) => {
      if (!el || el.dataset.split) return;
      el.dataset.split = "1";
      const s = el.innerHTML.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); const tok = [];
      s.replace(/<em>([\s\S]*?)<\/em>|([^<]+)|<[^>]*>/g, (m, hot, cold) => { if (hot != null) tok.push([hot, true]); else if (cold != null) tok.push([cold, false]); return ""; });
      const out = [];
      for (const [txt, hot] of tok) for (const w of txt.split(/\s+/).filter(Boolean)) out.push('<span class="w' + (hot ? " k" : "") + '" data-layout-allow-overflow><b>' + w + '</b></span>');
      el.innerHTML = out.join(" ");

    const rise = (sel, at) => { const w = document.querySelectorAll(sel + " .w > b"); tl.fromTo(w, { yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "power3.out", stagger: Math.min(0.05, 0.2 / Math.max(1, w.length - 1)) }, at); };
    const RET = '<circle class="r" cx="130" cy="130" r="110" /><path class="r" d="M130 0 L130 34 M130 226 L130 260 M0 130 L34 130 M226 130 L260 130 M130 92 L130 112 M130 148 L130 168 M92 130 L112 130 M148 130 L168 130" />';

      R.dataset.done = "1";
      const m = R.textContent.trim().match(/^([+-]?)([d.,]+)s*(.*)$/);
      if (m) { target = { sign: m[1], n: parseFloat(m[2].replace(",", ".")), dec: (m[2].split(/[.,]/)[1] || "").length }; unit = m[3]; R.innerHTML = '<span id="__ID__-num">' + m[1] + m[2] + '</span>' + (unit ? "<small>" + unit + "</small>" : ""); }
