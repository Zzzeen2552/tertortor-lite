<template>
  <!-- register: type (preset manga: a full-page FOCUS-LINE panel with one lettered sound effect or word)  |  job: __JOB__  |  hero: __HERO__ -->
  <!-- The hero is lettered like a manga sound effect (short, at most two words; the em word in the accent colour).
       Focus lines are drawn by the script from a fixed seed, so every render is the same. Mark "slam" = the word hits
       and the page shakes. Narration box = one short line (or delete it). Add class "black" on the page for a night beat. -->
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #__ID__-panel { left: 40px; top: 190px; width: 1000px; height: 980px; }
    #__ID__-lines { left: 0; top: 0; width: 1000px; height: 980px; }
    #__ID__-sfx { left: 0; right: 0; top: 360px; text-align: center; }
    #__ID__-box { left: 80px; top: 230px; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div id="__ID__-page" class="mg-page">
      <div id="__ID__-panel" class="mg-panel">
        <svg id="__ID__-lines" class="mg-lines" viewBox="0 0 1000 980"></svg>
        <div class="frame"></div>
      </div>
      <div id="__ID__-box" class="mg-box" data-safe="text">__JOB__</div>
      <div id="__ID__-sfx" class="mg-sfx" data-layout-allow-occlusion data-layout-allow-overflow data-safe="text">__HERO__</div>
    </div>
  </div>
  <script>
    const C = /*@cues*/{}/*@end*/;
    const tl = gsap.timeline({ paused: true });
    const D = C.dur ?? 2;
    const unEm = (el) => { if (el) el.innerHTML = el.innerHTML.replace(/&lt;(\/?em)&gt;/g, "<$1>"); };
    // focus lines: thin black wedges from the frame edge toward a white centre, from a fixed seed
    const focus = (sel, cx, cy, n, r0, seed) => {
      const svg = document.querySelector(sel); if (!svg || svg.dataset.done) return; svg.dataset.done = "1";
      let h = seed, d = "";
      for (let i = 0; i < n; i++) {
        h = (h * 1103515245 + 12345) & 0x7fffffff;
        const a = ((i + (h % 100) / 100) / n) * Math.PI * 2, w = 0.003 + (((h >> 8) % 100) / 100) * 0.011, r = r0 + ((h >> 4) % 180), R = 1600;
        d += "M" + (cx + Math.cos(a - w) * R).toFixed(1) + " " + (cy + Math.sin(a - w) * R).toFixed(1) + "L" + (cx + Math.cos(a) * r).toFixed(1) + " " + (cy + Math.sin(a) * r).toFixed(1) + "L" + (cx + Math.cos(a + w) * R).toFixed(1) + " " + (cy + Math.sin(a + w) * R).toFixed(1) + "Z";
      }
      svg.innerHTML = '<path fill="var(--ink)" d="' + d + '"/>';
    };
    focus("#__ID__-lines", 500, 470, 190, 230, [..."__ID__"].reduce((a, c) => (a * 31 + c.charCodeAt(0)) & 0xffff, 7));
    const sfx = document.querySelector("#__ID__-sfx"); unEm(sfx);
    if (sfx) { const n = sfx.textContent.trim().length; const fs = Math.min(240, Math.floor(880 / (0.8 * Math.max(4, n)))); sfx.style.fontSize = fs + "px"; sfx.style.top = Math.round(660 - 0.46 * fs) + "px"; }
    const S = C.slam ?? 0.12;
    tl.fromTo("#__ID__-panel", { clipPath: "inset(50% 0% 50% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.2, ease: "power4.out" }, 0);
    tl.fromTo("#__ID__-lines", { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "power4.out", transformOrigin: "500px 470px" }, 0);
    // ink boil: the lines twitch by a hair eight times a second (hand-drawn feel)
    const B = Math.max(1, Math.round(D * 8));
    for (let i = 1; i < B; i++) tl.set("#__ID__-lines", { rotate: (i % 2 ? 0.5 : -0.4) }, i / 8);
    tl.fromTo("#__ID__-box", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.08);
    tl.fromTo("#__ID__-sfx", { scale: 1.7, rotate: -16, opacity: 0 }, { scale: 1, rotate: -7, opacity: 1, duration: 0.22, ease: "back.out(2.2)" }, Math.min(S, 0.25));
    if (C.slam != null) tl.fromTo("#__ID__-page", { x: -18, y: 10 }, { x: 0, y: 0, duration: 0.22, ease: "elastic.out(1, 0.3)", immediateRender: false }, C.slam);
    tl.fromTo("#__ID__-sfx", { y: 0 }, { y: -20, duration: D, ease: "none", immediateRender: false }, 0.3);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
