<!--
  Hyperframe blocks: snippets to paste into compositions/<beat>.html. Not a scene (tools never load this file).
  Each block = markup (inside #root) + GSAP lines (inside the scene script, after `const tl = ...`).
  Replace __ID__ with the beat id. Classes come from presets/hyperframe/preset.json → css. Every number shown on screen
  must be spoken (lint); labels and corner text carry no digits. Keep text inside the 168-1330 px band.
-->

<!-- ───────────── MONITOR: a clip inside a graphic beat (video + infographic in one frame) ─────────────
     The <video> must stay visible (never fade it); animate the frame. data-duration = beat seconds. -->
<div id="__ID__-mon" class="hf-monitor" style="left:150px; top:230px; width:780px; height:560px">
  <video id="__ID__-clip" src="assets/footage/__ID__.mp4" data-start="0" data-duration="2.2" muted playsinline></video>
  <span class="tag">Cam B</span>
</div>
<script>
  tl.fromTo("#__ID__-mon", { clipPath: "inset(50% 0 50% 0)" }, { clipPath: "inset(0% 0 0% 0)", duration: 0.35, ease: "power4.out" }, 0);
  tl.fromTo("#__ID__-clip", { scale: 1.15 }, { scale: 1, duration: C.dur, ease: "power1.out" }, 0);
</script>

<!-- ───────────── RING TIMER: a draining ring around one spoken number ─────────────
     r = 120 → circumference 754. The number inside must be the one the voice says. -->
<div id="__ID__-ring" class="hf-ring" style="left:120px; top:860px; width:300px; height:300px">
  <svg viewBox="0 0 300 300" width="300" height="300"><circle class="track" cx="150" cy="150" r="120" /><circle id="__ID__-arc" class="fill" cx="150" cy="150" r="120" stroke-dasharray="754" stroke-dashoffset="0" transform="rotate(-90 150 150)" /></svg>
  <div class="num">5</div>
</div>
<script>
  tl.fromTo("#__ID__-ring", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.05);
  tl.fromTo("#__ID__-arc", { strokeDashoffset: 0 }, { strokeDashoffset: 754, duration: Math.max(0.6, C.dur - 0.2), ease: "none" }, 0.2);
</script>

<!-- ───────────── BARS: comparison, labels only (no digits unless spoken) ───────────── -->
<div id="__ID__-bars" class="hf-bars" style="left:90px; right:90px; top:700px">
  <div class="row"><span>Tanpa</span><div class="bar"><i id="__ID__-b1"></i></div></div>
  <div class="row"><span>Dengan</span><div class="bar"><i id="__ID__-b2"></i></div></div>
</div>
<script>
  tl.fromTo("#__ID__-b1", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.15);
  tl.fromTo("#__ID__-b2", { scaleX: 0 }, { scaleX: 0.18, duration: 0.6, ease: "power3.out" }, C.slam ?? 0.6);
</script>

<!-- ───────────── CHECKLIST on paper (drawn beat): tick or strike each item on its cue ───────────── -->
<ul id="__ID__-list" class="hf-check" style="left:130px; right:130px; top:420px">
  <li><u><b id="__ID__-t1"></b></u>Item satu</li>
  <li><u><b id="__ID__-t2"></b></u>Item dua<s id="__ID__-s2"></s></li>
</ul>
<script>
  tl.fromTo("#__ID__-list li", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 0.1);
  tl.fromTo("#__ID__-t1", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(3)" }, C.c1 ?? 0.6);
  tl.fromTo("#__ID__-s2", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, C.c2 ?? 1);
</script>

<!-- ───────────── TERMINAL: a command typed letter by letter, caret blinking a fixed number of times ─────────────
     Characters are split once in the script; typing = staggered steps, never a timer. -->
<div id="__ID__-term" class="hf-term" style="left:90px; right:90px; top:600px"><span class="p">✱ &gt;</span><span id="__ID__-cmd">make it dynamic</span><span id="__ID__-caret" class="caret"></span></div>
<script>
  const cmd = document.querySelector("#__ID__-cmd");
  if (cmd && !cmd.dataset.split) { cmd.dataset.split = "1"; cmd.innerHTML = [...cmd.textContent].map((ch) => `<span class="c">${ch === " " ? "&nbsp;" : ch}</span>`).join(""); }
  tl.fromTo("#__ID__-term", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
  tl.fromTo("#__ID__-cmd .c", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.045 }, 0.15);
  tl.fromTo("#__ID__-caret", { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", yoyo: true, repeat: 7, repeatDelay: 0.25 }, 0.2);
</script>

<!-- ───────────── PATH TEXT: a sentence riding a curve, the curve drawn under it ───────────── -->
<svg id="__ID__-path" class="hf-path" style="left:0; top:520px; width:1080px; height:500px" viewBox="0 0 1080 500">
  <path id="__ID__-curve" class="curve" d="M-60 380 C 240 120, 560 520, 1140 160" stroke-dasharray="1400" stroke-dashoffset="1400" />
  <text><textPath id="__ID__-tp" href="#__ID__-curve" startOffset="100%">Every frame is <tspan class="k">code</tspan></textPath></text>
</svg>
<script>
  tl.fromTo("#__ID__-curve", { strokeDashoffset: 1400 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0);
  tl.fromTo("#__ID__-tp", { attr: { startOffset: "100%" } }, { attr: { startOffset: "6%" }, duration: Math.max(0.8, C.dur), ease: "power2.out" }, 0);
</script>

<!-- ───────────── SPOTLIGHT: a cone from above for the one "reveal" beat (put it first inside the world layer) ───────────── -->
<div id="__ID__-spot" class="hf-spot"></div>
<script>
  tl.fromTo("#__ID__-spot", { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power2.out" }, 0);
</script>

<!-- ───────────── PHONE STACK: three real captures side by side (variants, before/after, three steps) ─────────────
     Each screen holds a REAL capture. Middle phone forward, outer two smaller and tilted. -->
<div id="__ID__-p1" class="hf-phone" style="left:40px; top:560px; width:320px; height:660px; padding:10px; border-radius:54px"><div class="screen" style="border-radius:44px"><img src="assets/screens/__ID__-1.png" alt="" /><div class="island" style="top:14px; width:96px; height:28px; margin-left:-48px"></div></div></div>
<div id="__ID__-p3" class="hf-phone" style="left:720px; top:560px; width:320px; height:660px; padding:10px; border-radius:54px"><div class="screen" style="border-radius:44px"><img src="assets/screens/__ID__-3.png" alt="" /><div class="island" style="top:14px; width:96px; height:28px; margin-left:-48px"></div></div></div>
<div id="__ID__-p2" class="hf-phone" style="left:350px; top:480px; width:380px; height:782px; padding:12px; border-radius:64px"><div class="screen" style="border-radius:52px"><img src="assets/screens/__ID__-2.png" alt="" /><div class="island" style="top:18px; width:116px; height:34px; margin-left:-58px"></div></div></div>
<script>
  tl.fromTo("#__ID__-p2", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 0);
  tl.fromTo("#__ID__-p1", { x: 200, rotate: 0, opacity: 0 }, { x: 0, rotate: -8, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.12);
  tl.fromTo("#__ID__-p3", { x: -200, rotate: 0, opacity: 0 }, { x: 0, rotate: 8, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.12);
</script>

<!-- ───────────── BENTO: feature cards around one idea. Card text comes from the script; no invented claims or numbers ───────────── -->
<div id="__ID__-bento" class="hf-bento" style="left:90px; right:90px; top:520px">
  <div class="wide hot"><small>Satu</small>Kalimat kunci dari naskah</div>
  <div><small>Dua</small>Fitur kedua</div>
  <div><small>Tiga</small>Fitur ketiga</div>
</div>
<script>
  tl.fromTo("#__ID__-bento > div", { y: 60, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)", stagger: 0.09 }, 0.1);
</script>
