<template>
  <!-- register: drawn (a feeling, a concept, an abstraction)  |  job: __JOB__  |  hero: __HERO__ -->
  <!-- World: light paper form (the contrast beat after dark ones). Swap the icon for the concept, or put a checklist / bars
       from blocks.html in the form instead. Mark "check" draws the tick and hits the key word (<em>, else the last) with a
       yellow box. Header and corner labels are yours (no digits). -->
  <style>
    #root { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
    #__ID__-sheet { position: absolute; inset: 0; transform-origin: 50% 40%; }
    #__ID__-icon { position: absolute; left: 330px; top: 330px; width: 420px; height: 420px; }
    #__ID__-label { position: absolute; left: 100px; right: 100px; top: 860px; text-align: center; font-size: 104px; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div id="__ID__-world" class="hf-layer hf-paper">
      <div id="__ID__-sheet">
        <div id="__ID__-form" class="hf-form"><header><span>Brief</span><span>Hyperframe</span></header></div>
        <svg id="__ID__-icon" viewBox="0 0 100 100">
          <circle id="__ID__-c" cx="50" cy="50" r="40" fill="none" stroke="#0B0B0F" stroke-width="7" stroke-dasharray="252" stroke-dashoffset="252" transform="rotate(-90 50 50)" />
          <path id="__ID__-p" d="M32 52 L45 64 L70 38" fill="none" stroke="#0B0B0F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" />
        </svg>
        <div id="__ID__-label" class="hf-head" data-safe="text" style="top:860px">__HERO__</div>
      </div>
    </div>
  </div>
  <script>
    const C = /*@cues*/{}/*@end*/;
    function split(sel, autoBig) {
      const el = document.querySelector(sel);
      if (!el || el.dataset.split) return el;
      el.dataset.split = "1";
      if (autoBig && (el.textContent.trim().length <= 10 || /\d/.test(el.textContent))) el.classList.add("big");
      const out = [];
      for (const n of [...el.childNodes]) {
        if (n.nodeType === 3) for (const w of n.textContent.split(/\s+/).filter(Boolean)) out.push(`<span class="w" data-layout-allow-overflow><b>${w}</b></span>`);
        else if (n.nodeType === 1) out.push(`<span class="w${n.tagName === "EM" ? " k" : ""}" data-layout-allow-overflow><b>${n.innerHTML}</b></span>`);
      }
      el.innerHTML = out.join(" ");
      if (!el.querySelector(".k")) el.querySelector(".w:last-child")?.classList.add("k");
      return el;
    }
    const label = split("#__ID__-label", false);
    const n = label ? label.querySelectorAll(".w").length : 1;
    const check = C.check ?? 0.45;
    const tl = gsap.timeline({ paused: true });
    // the sheet lands like paper slapped on a desk: a little tilt and overshoot, then a slow push
    tl.fromTo("#__ID__-sheet", { y: 120, rotate: -4, scale: 1.06 }, { y: 0, rotate: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 0);
    tl.fromTo("#__ID__-sheet", { scale: 1 }, { scale: 1.035, duration: Math.max(0.6, C.dur - 0.45), ease: "none", immediateRender: false }, 0.45);
    tl.fromTo("#__ID__-form", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power3.out" }, 0.02);
    tl.fromTo("#__ID__-c", { strokeDashoffset: 252 }, { strokeDashoffset: 0, duration: 0.45, ease: "power3.inOut" }, 0.08);
    tl.fromTo("#__ID__-label .w > b", { yPercent: 115, rotate: 8 }, { yPercent: 0, rotate: 0, duration: 0.36, ease: "power4.out", stagger: Math.min(0.05, 0.22 / Math.max(1, n - 1)) }, 0.08);
    tl.fromTo("#__ID__-p", { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.25, ease: "power3.out" }, check);
    tl.fromTo("#__ID__-icon", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, check + 0.1);
    tl.fromTo("#__ID__-label .k > b", { backgroundSize: "0% 84%" }, { backgroundSize: "100% 84%", duration: 0.25, ease: "power4.out", immediateRender: false }, check);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
