    // ---- built once: letters of the kinetic words, odometer columns, burst strokes, occluder groups ----

      const split = (el) => {
        for (const n of [...el.childNodes]) {
          if (n.nodeType === 3) {
            const f = document.createElement("span");
            f.innerHTML = [...n.textContent].map((ch) => (ch === " " ? " " : `<span class="c">${ch}</span>`)).join("");
            el.replaceChild(f, n);
          } else if (n.nodeType === 1 && !n.classList.contains("kt-dot")) split(n);
        }
      };
      document.querySelectorAll(".kt-box").forEach(split);
      const col = (el, last) => { el.innerHTML = Array.from({ length: last + 11 }, (_, i) => `<span>${i % 10}</span>`).join(""); };
      col(document.querySelector("#kv-odo1"), 2);
      col(document.querySelector("#kv-odo2"), 5);
      const burst = (el, n, r0, len) => { el.innerHTML = Array.from({ length: n }, (_, i) => `<i style="height:${len}px;transform:rotate(${(360 / n) * i}deg) translateY(${r0}px)"></i>`).join(""); };
      burst(document.querySelector("#kv-gb"), 14, 330, 70);
      burst(document.querySelector("#kv-bb"), 10, 150, 34);

    const g = document.querySelector("#kv-occ-shapes");
    if (g && !g.dataset.done) {
      g.dataset.done = "1";
      g.innerHTML = OCC.map((p) => `<polygon points="${p}" />`).join("") + '<g id="kv-occ-dyn"></g>';
    }
    const dynG = document.querySelector("#kv-occ-dyn");
    let lastI = -2;
    const setOcc = (t) => {
      const i = Math.max(0, Math.min(DYN.runs.length - 1, Math.round((t - DYN.t0) * DYN.fps)));
      if (i === lastI || !dynG) return;
      lastI = i;
      dynG.innerHTML = DYN.runs[i].map(([a, b]) => `<polygon points="${a},468 ${b},468 ${b},516 ${a},516" />`).join("");
    };

    // ---- times (s) ----
    // on a 100 BPM grid (beat = 0.6 s, beats at 0.55 + 0.6 n): cuts on beats, hits on beats or half beats
    const T = { b: 0.55, c: 1.15, strike: 1.45, d: 1.75, g: 2.65, k: 2.75, odo: 2.95, slam: 3.55, fly: 3.85,
      end1: 3.95, shine: 5.95, toB: 7.45, card: 7.75, box: 7.75, grid: 8.35, hit: 10.75, close: 11.35, end: 13 };
    const ACC = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1F5BC6";
    const tl = gsap.timeline({ paused: true });
    const punch = (sel, t, k = 1.06, d = 0.4) => {
      tl.fromTo(sel, { scale: 1 }, { scale: k, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
      tl.fromTo(sel, { scale: k }, { scale: 1, duration: d, ease: "expo.out", immediateRender: false }, t + 0.07);
    };
    const fire = (sel, t) => {
      tl.set(`${sel} i`, { scaleY: 0 }, 0);
      tl.fromTo(`${sel} i`, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, t);
      tl.fromTo(`${sel} i`, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none", immediateRender: false }, t + 0.18);
    };
    const swap = (from, to, t) => { tl.set(from, { opacity: 0 }, t); tl.set(to, { opacity: 1 }, t); };
    // letters rise up from behind the family, a little sideways drift, blur clears
    const boxIn = (sel, t, dir = 1) => {
      tl.fromTo(sel + " .c", { opacity: 0, yPercent: 70, x: 40 * dir, filter: "blur(12px)" }, { opacity: 1, yPercent: 0, x: 0, filter: "blur(0px)", duration: 0.36, ease: "expo.out", stagger: 0.022 }, t);
      if (document.querySelector(sel + " .kt-dot")) tl.fromTo(sel + " .kt-dot", { scale: 0 }, { scale: 1, duration: 0.28, ease: "back.out(3)", transformOrigin: "50% 80%" }, t + 0.2);
    };

    // ---- 0-2.65 s: kinetic type over the clip, the camera punches on every hit ----
    // the clip pushes in slowly underneath; "Healing." is already on screen at frame 0 (thumbnail)
    tl.fromTo("#kv-photo", { scale: 1.0 }, { scale: 1.1, duration: T.g, ease: "none" }, 0);
    punch("#kt-a .kt-box", 0.08, 1.07);
    punch("#kv-bg", 0.08, 1.03);
    swap("#kt-a", "#kt-b", T.b);
    boxIn("#kt-b .kt-l:nth-child(1) .kt-box", T.b, -1);
    boxIn("#kt-b .kt-l:nth-child(2) .kt-box", T.b + 0.1, 1);
    punch("#kv-bg", T.b + 0.12, 1.03);
    swap("#kt-b", "#kt-c", T.c);
    boxIn("#kt-c .kt-l:nth-child(1) .kt-box", T.c, 1);

    // partner logos: a simple pop, one cell after another
    tl.fromTo(".kv-cell img", { opacity: 0, scale: 0.85, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 }, T.grid + 0.3);

    const cuts = document.querySelectorAll("#kv-cut img");
    let lastCut = -2;
    const setCut = (t) => {
      const i = t < 2.78 ? Math.min(cuts.length - 1, Math.round(t * 30)) : -1;
      if (i === lastCut) return;
      if (lastCut >= 0 && cuts[lastCut]) cuts[lastCut].style.opacity = "0";
      if (i >= 0 && cuts[i]) cuts[i].style.opacity = "1";

    };
    tl.eventCallback("onUpdate", () => { setOcc(tl.time()); setCut(tl.time()); });
    setOcc(0);
    setCut(0);
    window.__timelines["kv"] = tl;
