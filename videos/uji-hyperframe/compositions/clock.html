<template>
  <!-- register: footage (monitor block: clip inside a HUD beat + ring timer)  |  job: the clock  |  hero: Gone in five seconds -->
  <style>
    #root { position: absolute; inset: 0; background: var(--ground); overflow: hidden; }
    #clock-line { position: absolute; left: 440px; right: 90px; top: 830px; font-size: 92px; }
  </style>
  <div id="root" data-composition-id="clock" data-width="1080" data-height="1920">
    <div id="clock-world" class="hf-layer hf-hud">
      <div id="clock-grid" class="hf-grid" data-layout-allow-overflow></div>
    </div>
    <div id="clock-mon" class="hf-monitor" style="left:150px; top:230px; width:780px; height:520px">
      <video id="clock-clip" src="assets/footage/clock-lib.mp4" data-start="0" data-duration="2.23" muted playsinline></video>
      <span class="tag">Cam B</span>
    </div>
    <div id="clock-ring" class="hf-ring" style="left:90px; top:810px; width:300px; height:300px">
      <svg viewBox="0 0 300 300" width="300" height="300"><circle class="track" cx="150" cy="150" r="120" /><circle id="clock-arc" class="fill" cx="150" cy="150" r="120" stroke-dasharray="754" stroke-dashoffset="0" transform="rotate(-90 150 150)" /></svg>
      <div class="num">5</div>
    </div>
    <h1 id="clock-line" class="hf-head" data-safe="text" style="top:830px">Gone in <em>five</em> seconds</h1>
    <div id="clock-corners" class="hf-layer hf-corners"><i></i><i></i><i></i><i></i><span class="rec">Rec</span><span>Cam B</span><span>Dramatisation</span><span>▮▮▯▯</span></div>
  </div>
  <script>
    const C = /*@cues*/{"slam":1.02,"dur":2.2333333333333334}/*@end*/;
    const css = getComputedStyle(document.documentElement), ACC = css.getPropertyValue("--accent").trim() || "#FFD23F", ON = css.getPropertyValue("--on-accent").trim() || "#0B0B0F"; // the video's colour tone
    function split(sel) {
      const el = document.querySelector(sel);
      if (!el || el.dataset.split) return el;
      el.dataset.split = "1";
      const out = [];
      for (const n of [...el.childNodes]) {
        if (n.nodeType === 3) for (const w of n.textContent.split(/\s+/).filter(Boolean)) out.push(`<span class="w" data-layout-allow-overflow><b>${w}</b></span>`);
        else if (n.nodeType === 1) out.push(`<span class="w${n.tagName === "EM" ? " k" : ""}" data-layout-allow-overflow><b>${n.innerHTML}</b></span>`);
      }
      el.innerHTML = out.join(" ");
      return el;
    }
    split("#clock-line");
    const slam = C.slam;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#clock-grid", { y: 0 }, { y: -90, duration: C.dur, ease: "none" }, 0);
    tl.fromTo("#clock-corners", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
    // monitor opens from a horizontal slit; the clip inside pushes in slowly (the video element itself is never faded)
    tl.fromTo("#clock-mon", { clipPath: "inset(50% 0 50% 0)" }, { clipPath: "inset(0% 0 0% 0)", duration: 0.35, ease: "power4.out" }, 0);
    tl.fromTo("#clock-clip", { scale: 1.15 }, { scale: 1, duration: C.dur, ease: "power1.out" }, 0);
    tl.fromTo("#clock-ring", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.05);
    tl.fromTo("#clock-arc", { strokeDashoffset: 0 }, { strokeDashoffset: 754, duration: C.dur - 0.2, ease: "none" }, 0.2);
    tl.fromTo("#clock-line .w > b", { yPercent: 115, rotate: 8 }, { yPercent: 0, rotate: 0, duration: 0.38, ease: "power4.out", stagger: 0.05 }, 0.08);
    tl.fromTo("#clock-line .k > b", { backgroundSize: "0% 84%", color: ACC }, { backgroundSize: "100% 84%", color: ON, duration: 0.3, ease: "power4.out", immediateRender: false }, slam);
    tl.fromTo("#clock-line .k", { scale: 1.22 }, { scale: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, slam);
    tl.fromTo("#clock-ring .num", { scale: 1.3, color: ACC }, { scale: 1, color: "#F5F3EE", duration: 0.3, ease: "power4.out", immediateRender: false }, slam);
    window.__timelines["clock"] = tl;
  </script>
</template>
