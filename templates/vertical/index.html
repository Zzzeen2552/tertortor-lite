<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /*@brand*/:root {}/*@end*/
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-body); color: var(--ink); }
      .clip { position: absolute; inset: 0; }
      #captions { z-index: 50; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!-- Beat hosts: one per beat in beats.json. tools/cues.mjs writes their data-start / data-duration. -->
      <!--@beats-->
      <!--@beats-end-->

      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="10" data-track-index="9" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="10" data-track-index="10"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
