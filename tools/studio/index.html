<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TERTORTOR LITE</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
<meta name="theme-color" content="#0F1012" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="TERTORTOR" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<script>try { const t = localStorage.getItem("motion_theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
/* Bahasa visual REDACTOR: kanvas abu hangat, panel putih membulat, aksen kuning, Outfit + JetBrains Mono. */
:root{
  --bg:#ECEDEF; --panel:#FFFFFF; --panel-2:#F4F5F7; --line:#E8E9EC; --line-2:#DADCE0;
  --fg:#17181B; --muted:#6B6F77; --dim:#9EA2A9;
  --accent:#FCBA03; --accent-ink:#17181B; --accent-text:#8A5A00; --accent-soft:rgba(252,186,3,.18);
  --ok:#15803d; --warn:#b45309; --bad:#dc2626; --info:#2563eb; --violet:#7c3aed;
  --glow:rgba(252,186,3,.20);
  --f-display:"Outfit","Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:24px; --r-sm:16px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1012; --panel:#18191C; --panel-2:#212226; --line:#26282C; --line-2:#34363B;
  --fg:#F2F2F3; --muted:#9A9DA4; --dim:#6B6E75;
  --accent-text:#FCBA03; --accent-soft:rgba(252,186,3,.14);
  --ok:#5fe39a; --warn:#f6b54c; --bad:#ff6b6b; --info:#6aa8ff; --violet:#a78bfa;
  --glow:rgba(252,186,3,.07); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-display);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 700px at 100% 100%,var(--glow),transparent 62%),radial-gradient(900px 520px at 0% 0%,color-mix(in srgb,var(--panel) 55%,transparent),transparent 65%),var(--bg);background-attachment:fixed}
a{color:inherit} button,input,textarea{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{display:block;font-size:17px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:-2px}
.sec-h{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;padding:0 10px;margin-bottom:6px}
.switch,.nav{display:flex;flex-direction:column;gap:2px}
.mchip{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:9px;border:1px solid transparent;background:none;text-align:left;color:var(--muted);font-size:13px;text-decoration:none;min-width:0}
.mchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip:hover{background:var(--panel-2);color:var(--fg)}
.mchip.on{background:var(--panel-2);border-color:var(--line-2);color:var(--fg)}
.mchip b{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--dim)}
.mdot{width:9px;height:9px;border-radius:3px;background:var(--c,var(--muted));flex:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid transparent;color:var(--muted);font-size:13.5px;text-decoration:none;white-space:nowrap}
.nav a svg{width:16px;height:16px;flex:none;opacity:.85}
.nav a:hover{color:var(--fg);background:var(--panel-2)}
.nav a.on{color:var(--accent-text);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-weight:600;font-size:10.5px;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12px}
.side-foot small{display:block;color:var(--muted);font-size:11px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);flex:none}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:none;display:grid;place-items:center;color:var(--muted);margin-left:auto}
.icon-btn:hover{color:var(--fg)} .icon-btn svg{width:15px;height:15px}
.main{min-width:0;padding:26px max(16px,4vw) 70px}

/* page head */
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:.95;letter-spacing:.01em;margin:6px 0 8px;text-transform:uppercase;text-wrap:balance}
.vh p{margin:0;color:var(--muted);max-width:64ch}
.vh-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)} .btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:wait}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
.panel-h small{font-weight:400;color:var(--muted);font-size:12px}
.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pill.acc{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.meta-row{display:flex;gap:6px;flex-wrap:wrap}
.cmd{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);font-family:var(--f-mono);font-size:12.5px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .big{font-family:var(--f-display);font-size:46px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.stat.hot{border-color:color-mix(in srgb,var(--accent) 45%,transparent)} .stat.hot .big{color:var(--accent-text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;text-decoration:none}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.cover{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#0b0b0f}
.cover-wip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:repeating-linear-gradient(135deg,#101015 0 14px,#15151c 14px 28px);color:#fff;text-align:center;padding:16px}
.cover-wip span{background:var(--accent);color:#000;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.cover-wip small{color:rgba(255,255,255,.55);font-size:11.5px}
.cv{position:relative}
.wip{position:absolute;left:10px;bottom:10px;background:var(--accent);color:#000;font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cnt{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:5px}
.card-b{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px}
.card-t{font-weight:600;font-size:13.5px;line-height:1.3}
.prog{height:4px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* form */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.fld label,.fld .lb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fld .hint{font-size:12px;color:var(--muted)}
textarea,input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:13.5px}
textarea{resize:vertical;min-height:180px;line-height:1.5}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-sm);padding:20px;text-align:center;color:var(--muted);cursor:pointer;background:color-mix(in srgb,var(--fg) 3%,transparent);font-size:13px}
.drop:hover,.drop.over{color:var(--fg);border-color:var(--accent)}
.drop input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.thumbs video{height:92px;border-radius:10px;border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.seg label{padding:8px 14px;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--f-display);letter-spacing:0;text-transform:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:600}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.tips li{margin-bottom:8px;color:var(--muted);font-size:13px} .tips b{color:var(--fg);font-weight:600}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
.ed.wide{grid-template-columns:minmax(0,1fr)} .ed.wide > .viewer{display:none} /* tab Draft: book | draft side by side need the width */
.viewer{position:sticky;top:20px}
/* Cinematic (16:9, tools/cinematic.mjs): wide player above the panel */
.ed.cine{grid-template-columns:minmax(0,1fr)} .ed.cine .stage{aspect-ratio:16/9} .ed.cine .blist .bt{aspect-ratio:16/9;width:96px}
.stage{width:100%;aspect-ratio:9/16;border-radius:18px;background:#0b0b0f;display:block;object-fit:contain;border:1px solid var(--line)}
.linkrow{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.linkrow #linkBox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linkrow #linkBox[hidden]{display:none}
.linkrow input{flex:1;min-width:0;font-size:12.5px}
.stage.ph{display:grid;place-items:center;color:#777;font-size:13px;text-align:center;padding:30px}
.vnav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;font-size:12px;color:var(--muted)}
.tline{display:flex;gap:3px;margin-top:12px;height:64px}
.tb{position:relative;min-width:8px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--panel-2);padding:0;flex:var(--w) 1 0}
.tb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.tb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc)}
.tb.on{border-color:var(--accent)}
.btab{width:100%;border-collapse:collapse;font-size:13px} .btab th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line)} .btab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top} .btab tr td:first-child{border-left:3px solid var(--rc);white-space:nowrap} .btab small{color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:4px;border-radius:2px;background:var(--rc);margin-right:5px;vertical-align:middle}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.tabs button span{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-left:4px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button.on span{color:var(--accent-text)}
.tabs a{border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);font-size:13.5px;white-space:nowrap;text-decoration:none} .tabs a.on{color:var(--fg);border-bottom-color:var(--accent)}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.blist li:last-child{border-bottom:0}
.blist li:hover{background:var(--panel-2)}
.blist li.on{background:var(--accent-soft)}
.blist .bt{width:54px;aspect-ratio:9/16;border-radius:7px;object-fit:cover;background:#0b0b0f;display:block;border-bottom:3px solid var(--rc)}
.blist b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist time{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);white-space:nowrap;text-align:right}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.doc{white-space:pre-wrap;font-size:14.5px;line-height:1.7;max-width:68ch}
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent);margin-bottom:16px;font-size:13.5px}
.notice.ok{border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 7%,transparent)}
.notice b{font-weight:600} .notice .sp{margin-left:auto;display:flex;gap:8px}
.shot{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.shot-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.shot-h b{font-size:14px} .shot-b{padding:12px 14px;display:grid;gap:12px}
.shot-b .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.shot-b img{width:96px;border-radius:8px;border:1px solid var(--line)}
.drgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start} .drsrc{max-height:72vh;overflow:auto;white-space:pre-wrap} .drtext{width:100%;min-height:72vh;font:15px/1.6 var(--font-body,inherit);resize:vertical} @media (max-width:860px){.drgrid{grid-template-columns:minmax(0,1fr)} .drsrc{max-height:40vh} .drtext{min-height:60vh}}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px 8px;align-items:start;margin-bottom:12px}
.lrow > :not(.del){grid-column:1} .lrow .del{grid-column:2;grid-row:1;width:36px;height:36px;padding:0}
.lrow input[data-k=en]{font-size:12.5px;color:var(--muted)} .lrow textarea{min-height:80px}
.sline{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);max-width:80ch}
.sline small{font-size:12.5px}
.prompt{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 70px 10px 12px;font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap}
.prompt .btn{position:absolute;top:6px;right:6px}
.prompt .lb{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.issues{margin:0 0 14px;padding:0;list-style:none;font-size:12.5px}
.cuts{display:flex;gap:4px}
.cut{min-width:0;padding:8px 10px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:12px;display:flex;flex-direction:column;gap:2px}
.cut .mono{font-size:10.5px;color:var(--accent-text)} .cut b{font-weight:600;overflow:hidden;text-overflow:ellipsis} .cut small{color:var(--muted)}
.issues li{padding:3px 0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.preset{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer;background:var(--panel)}
.preset input{position:absolute;opacity:0;pointer-events:none}
.preset:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .sw{display:flex;gap:3px;margin-bottom:4px} .preset .sw i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
a.preset{color:inherit;text-decoration:none} a.preset:hover{border-color:var(--accent)} .preset.draft{opacity:.62;border-style:dashed}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--muted)} .crumb a{color:var(--muted)} .crumb b{color:var(--fg)}
.grp-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px} .grp-h h2{font-size:17px;margin:0} .grp-h small{color:var(--muted);font-size:12.5px}
.vgrp{padding:8px 10px 2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tones{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .tone{position:relative;width:34px;height:34px;border-radius:50%;cursor:pointer;border:1px solid var(--line-2)} .tone>input[type=radio]{position:absolute;opacity:0;pointer-events:none} .tone:has(input[type=radio]:checked){box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)} .tone.custom{background:conic-gradient(#f43,#fc3,#3c6,#3af,#a6f,#f43);overflow:hidden} .tone.custom input[type=color]{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);border:0;padding:0;opacity:0;cursor:pointer} .tone.custom:has(input[type=radio]:checked) input[type=color]{opacity:1}
.preset .cov{display:block;width:calc(100% + 24px);margin:-12px -12px 8px;aspect-ratio:3/4;object-fit:cover;object-position:50% 40%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--panel-2)}
.preset .strip{display:flex;gap:3px;margin-bottom:8px} .preset .strip img{flex:0 0 calc((100% - 12px) / 5);min-width:0;aspect-ratio:9/16;object-fit:cover;border-radius:5px;background:var(--panel-2)}
.preset b{font-size:14px} .preset small{color:var(--muted);font-size:12px;line-height:1.4} .preset em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
button.pill{cursor:pointer;background:none}
select.sel,input[list]{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--fg)}
.chip{background:none;border:1px dashed var(--line-2);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:11.5px;cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--accent)} .issues .e{color:var(--bad)} .issues .w{color:var(--warn)}
.doc .cur{background:var(--accent-soft);border-radius:4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal img,.gal video{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.sub{margin:18px 0 8px}

/* library */
.clip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.clip video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
.clip div{padding:9px 11px;font-size:12px;color:var(--muted)}
.clip b{color:var(--fg);font-weight:600}
.search{max-width:420px;margin-bottom:16px}

.notice.work{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel,transparent))} .notice.work.idle{border-color:var(--bad)}
.pop{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45)} .pop[hidden]{display:none}
.pop .box{background:var(--panel,var(--bg));color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pop h3{margin:0 0 6px;font-size:18px} .pop p{margin:8px 0;font-size:14px;line-height:1.5} .pop .warn{color:var(--bad)}
.donebox{position:fixed;z-index:110;right:16px;bottom:16px;max-width:min(380px,calc(100vw - 32px));background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3)} .donebox[hidden]{display:none} .donebox a{color:var(--accent);font-weight:600;white-space:nowrap} .donebox button{background:none;border:0;color:inherit;font-size:18px;cursor:pointer}
#pushBtn.on{color:var(--accent)}
.toast{position:fixed;z-index:100;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:1100px){.ed{grid-template-columns:minmax(0,1fr)}.viewer{position:static;max-width:400px;margin:0 auto;width:100%}.form-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px;gap:12px}
  .switch,.nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:6px}
  .mchip{width:auto;white-space:nowrap;border-color:var(--line)}
  .side .sec-h,.side-foot small{display:none}
  .main{padding-top:20px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat .big{font-size:36px}.kv{grid-template-columns:minmax(0,1fr)}}
/* Chat panel (user 2026-11-13): Claude Code on the laptop, from inside Studio */
.chat-fab{position:fixed;right:20px;bottom:20px;z-index:60;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer}
.chat-fab svg{width:24px;height:24px}
.chat-fab .dot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:#2fb36b;border:2px solid var(--accent);display:none}
.chat-fab.busy .dot{display:block;animation:chatPulse 1.2s ease-in-out infinite}
@keyframes chatPulse{50%{opacity:.35}}
.chat{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease}
.chat.open{transform:none}
.chat-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-h b{flex:1;font-size:15px} .chat-h small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.chat-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chat-m{max-width:92%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-m.user{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.chat-m.assistant{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.chat-m.tool,.chat-m.info{align-self:flex-start;padding:2px 4px;font:11.5px/1.4 var(--f-mono,monospace);color:var(--muted);white-space:normal}
.chat-m.tool::before{content:"⚙ "} .chat-m.info::before{content:"ⓘ "}
.chat-m.error{align-self:flex-start;background:color-mix(in srgb,#e5484d 14%,transparent);color:var(--fg);font-size:13px}
.chat-m code{font:12.5px var(--f-mono,monospace);background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px}
.chat-m a{color:var(--accent-text);text-decoration:underline}
.chat-empty{color:var(--muted);font-size:13.5px;line-height:1.55;margin:auto 0;text-align:center;padding:0 10px}
.chat-work{font-size:12px;color:var(--muted);padding:0 16px 6px;min-height:18px}
.chat-f{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chat-f textarea{flex:1;resize:none;min-height:44px;max-height:160px;font:14px/1.45 inherit;padding:10px 12px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
  <aside class="side">
    <a href="#/" class="brand">
      <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></span>
      <span><b>TERTORTOR LITE</b><small>Studio video vertikal</small></span>
    </a>
    <nav class="nav" aria-label="Menu utama">
      <div class="sec-h">Produksi</div>
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Ruang Produksi</a>
      <a href="#/baru" data-nav="baru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Buat Video</a>
      <a href="#/sampah" data-nav="sampah" id="navTrash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Sampah</a>
      <a href="#/user" data-nav="user" id="navUser" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>User</a>
    </nav>
    <div>
      <div class="sec-h">Gaya · library per channel</div>
      <div class="switch" id="snav"></div>
    </div>
    <div>
      <div class="sec-h">Video</div>
      <div class="switch" id="vnav"></div>
    </div>
    <div class="side-foot">
      <span class="live" id="liveDot"></span>
      <div style="min-width:0"><b id="liveName">Lokal</b><small id="liveNote">localhost · render di laptop</small></div>
      <button class="icon-btn" id="pushBtn" hidden aria-label="Notifikasi" title="Aktifkan notifikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      <form method="post" action="/logout" id="logoutF" hidden><button class="icon-btn" aria-label="Keluar" title="Keluar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></form>
      <button class="icon-btn" id="theme" aria-label="Ganti tema" title="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<button class="chat-fab" id="chatFab" hidden aria-label="Chat dengan Claude" title="Chat dengan Claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="dot"></span></button>
<section class="chat" id="chat" aria-label="Chat Claude" aria-hidden="true">
  <div class="chat-h"><b>Claude<small>jalan di laptop · TERTORTOR LITE</small></b>
    <button class="btn sm" id="chatStop" hidden>Hentikan</button>
    <button class="btn sm" id="chatNew" title="Mulai percakapan baru">Baru</button>
    <button class="icon-btn" id="chatX" aria-label="Tutup chat">×</button></div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-work" id="chatWork"></div>
  <form class="chat-f" id="chatF"><textarea id="chatIn" rows="1" placeholder="Tulis ke Claude… (Enter kirim, Shift+Enter baris baru)"></textarea><button class="btn pri" id="chatSend">Kirim</button></form>
</section>
<div class="pop" id="workPop" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="workPopH"><h3 id="workPopH"></h3><div id="workPopB"></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn pri" id="workPopOk">Oke</button></div></div></div>
<div class="donebox" id="doneBox" hidden><span id="doneMsg" style="flex:1"></span><a id="doneLink" href="#">Buka</a><button id="doneX" aria-label="Tutup">×</button></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const REG = { footage: ["var(--bad)", "Footage"], screen: ["var(--info)", "Screen"], drawn: ["var(--violet)", "Drawn"], type: ["var(--accent)", "Type"], photo: ["var(--good, #3fa66b)", "Photo"], document: ["var(--muted)", "Document"], map: ["var(--info)", "Map"] };
// a shot without "cuts" is one cut over the whole clip (same rule as tools/flow.mjs)
const cutsOf = (s) => (s.cuts?.length ? s.cuts : [{ from: 0, to: s.seconds, beat: s.beat, cue: s.cue, desc: s.purpose }]);
// Docucine beat table (user 2026-11-09): time → narration → the one hero → on-screen text, approved before the world is built
function beatTableView(v) {
  const rows = v.beatTable ?? [], a = v.beatsApproval ?? {};
  if (!rows.length) return `<div class="pad"><div class="empty"><b>Belum ada beat table</b>${v.approval?.approved ? "Claude sedang membuat suara, lalu menyusun beat table dari waktu kata yang asli." : "Setujui naskah dulu. Setelah itu Claude membuat suara, lalu beat table untuk kamu setujui."}${v.sourceError ? `<br><span style="color:var(--bad)">Artikel sumber gagal dibaca: ${esc(v.sourceError)}</span>` : ""}</div></div>`;
  const bar = a.approved
    ? `<div class="notice ok"><span><b>Beat table disetujui</b> · ${new Date(a.at).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" })}. Claude membangun dunianya.</span><span class="sp"><button class="btn sm" id="bUnapprove">Batalkan</button></span></div>`
    : `<div class="notice"><span>${a.stale ? "<b>Beat table berubah setelah disetujui.</b> " : ""}<b>Cek tiap baris:</b> satu hero per kalimat, teks layar tidak mengulang narasi. Setelah disetujui, Claude membangun dunia, mengecek still dan gerak kamera, lalu menyiapkan thumbnail.</span><span class="sp"><button class="btn pri sm" id="bApprove">Setujui beat table</button></span></div>`;
  return `<div class="pad">${bar}</div><div class="pad" style="padding-top:0;overflow-x:auto"><table class="btab"><thead><tr><th>Waktu</th><th>Narasi</th><th>Hero di layar</th><th>Teks layar</th></tr></thead><tbody>${rows.map((r) => `<tr style="--rc:${REG[r.register]?.[0] ?? "var(--muted)"}"><td class="mono">${fmt(r.start)}<br><small>${r.duration.toFixed(1)}s</small></td><td>${esc(r.narration)}</td><td><b>${esc(r.hero)}</b><br><small>${REG[r.register]?.[1] ?? esc(r.register ?? "")}</small></td><td>${r.text ? esc(r.text) : '<span class="muted">—</span>'}</td></tr>`).join("")}</tbody></table></div>`;
}
// colour tone of a video: the preset's own accent, its suggested tones (preset.json "tones"), or a free colour
const toneRow = (p, cur) => {
  const own = String(p.colors?.accent || "#888888"), on = String(cur || own).toLowerCase();
  const list = [{ label: "Bawaan preset", accent: own }, ...(p.tones ?? []).filter((t) => t.accent.toLowerCase() !== own.toLowerCase())];
  const known = list.some((t) => t.accent.toLowerCase() === on);
  return `<div class="tones">${list.map((t, i) => `<label class="tone" title="${esc(t.label)}" style="background:${esc(t.accent)}"><input type="radio" name="tone" value="${i ? esc(t.accent) : ""}" ${t.accent.toLowerCase() === on ? "checked" : ""}></label>`).join("")}<label class="tone custom" title="Warna sendiri"><input type="radio" name="tone" value="custom" ${known ? "" : "checked"}><input type="color" class="tone-custom" value="${esc(known ? own : on)}"></label></div>`;
};
const toneVal = (root = document) => {
  const r = root.querySelector("input[name=tone]:checked");
  return !r || !r.value ? undefined : r.value === "custom" ? root.querySelector(".tone-custom").value : r.value;
};
const presetCard = (p, on) => `<label class="preset"><input type="radio" name="preset" value="${esc(p.id)}" ${on ? "checked" : ""}><span class="sw">${["ground", "card", "accent", "alert", "ink"].map((k) => `<i style="background:${esc(p.colors?.[k] || "#888")}"></i>`).join("")}</span><b>${esc(p.label || p.id)}</b><small>${esc(p.description || "")}</small><em>${esc(p.fonts?.display || "")}</em></label>`;
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); };
// copy that also works where the Clipboard API is blocked (http on a LAN address, in-app browsers): a hidden textarea +
// execCommand runs first, inside the click itself, then the Clipboard API on top. Returns false when both fail.
const copyText = (txt) => {
  let ok = false;
  const ta = document.createElement("textarea");
  ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  try { navigator.clipboard?.writeText(txt).catch(() => {}); ok = ok || !!navigator.clipboard; } catch {}
  return ok;
};
const copy = (txt) => toast(copyText(txt) ? "Tersalin: " + txt : "Browser menolak menyalin. Salin manual.");
// script editor rows: a Storytelling caption line (Indonesian + English) or an explainer paragraph
const naskahRow = (kind, l) => kind === "shot"
  ? `<div class="lrow"><input type="text" data-k="text" value="${esc(l.text)}" placeholder="Kalimat lisan (Indonesia)"><input type="text" data-k="en" value="${esc(l.en)}" placeholder="English: kosongkan untuk terjemahan otomatis"><button class="btn sm del" data-del title="Hapus kalimat" aria-label="Hapus kalimat">×</button></div>`
  : `<div class="lrow"><textarea data-k="para" placeholder="Paragraf lisan">${esc(l.text)}</textarea><button class="btn sm del" data-del title="Hapus paragraf" aria-label="Hapus paragraf">×</button></div>`;
const naskahWarns = {}; // slug -> warnings from the last save, shown once on the Naskah tab
let videos = [];

// Opened through the web relay (tools/relay.mjs): 401 → login, 202 queued → the laptop is off and the decision waits
// in the relay's queue, and the sidebar foot shows whether the laptop is online. Locally /api/relay/status is a 404
// and nothing here changes.
const _fetch = window.fetch.bind(window);
window.fetch = async (...a) => {
  const r = await _fetch(...a);
  if (r.status === 401 && !String(a[0]).startsWith("/login")) { location.href = "/login"; throw new Error("Belum login"); }
  if (r.status === 202) setTimeout(() => toast("Laptop offline: masuk antrean, dijalankan saat laptop menyala"), 1700);
  if (r.status === 403 && me?.role === "viewer") setTimeout(() => toast("Akun viewer hanya bisa melihat."), 300);
  return r;
};
// who is logged in through the relay ({ email, role, name, owner }); locally the route is a 404 and me stays null
// (Studio on the laptop is the owner). The "User" page is for admins on the web, and always on the laptop.
let me = null;
const meReady = _fetch("/api/relay/me").then((r) => (r.ok ? r.json() : null)).catch(() => null).then((x) => {
  me = x;
  $("#navUser").hidden = !!me && me.role !== "admin";
  $("#navTrash").hidden = me?.role === "viewer";
  if (me) { $("#logoutF").hidden = false; $("#logoutF").style.display = "contents"; $("#logoutF button").title = `Keluar (${me.email} · ${me.role})`; }
  return me;
});
async function relayStatus() {
  const r = await _fetch("/api/relay/status").catch(() => null);
  if (!r?.ok) return false;
  const s = await r.json();
  $("#liveName").textContent = s.online ? "Web · laptop online" : "Web · laptop offline";
  $("#liveNote").textContent = s.online
    ? (s.failed.length ? `${s.failed.length} antrean gagal, terakhir ${s.failed.at(-1).path}` : "render tetap di laptop")
    : `${s.lastSeen ? "terakhir " + new Date(s.lastSeen).toLocaleString("id-ID", { dateStyle: "short", timeStyle: "short" }) : "belum pernah tersambung"}${s.queued.length ? ` · ${s.queued.length} antre` : ""}`;
  $("#liveDot").style.background = s.online ? "" : "var(--bad)";
  return true;
}
relayStatus().then((web) => web && setInterval(relayStatus, 20000));

// ---------- what Claude is doing (user 2026-11-07) ----------
// After each approval a popup says what Claude does next, how long it usually takes (tools/progress.mjs learns this
// from past runs), and whether a Claude session is listening at all. While it runs, the project shows a banner; when
// the output appears, a box says so (and the web relay sends a push to the phone, see pushSetup).
let workingNow = [], claudeOn = false, pushOn = false;
const hhmm = (d) => new Date(d).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
const etaText = (w) => { const t = Date.parse(w.since); return `${w.eta[0]}–${w.eta[1]} menit (sekitar ${hhmm(t + w.eta[0] * 60e3)}–${hhmm(t + w.eta[1] * 60e3)})`; };
const idleNote = () => `Tidak ada sesi Claude yang sedang menunggu klikmu. Buka Claude Code di laptop dan ketik <b>lanjut</b>; klikmu sudah tersimpan dan tidak hilang.`;
async function fetchWorking() { const r = await _fetch("/api/working").catch(() => null); return r?.ok ? r.json() : null; }
function paintWork() {
  document.querySelectorAll("[data-workbar]").forEach((el) => {
    const w = workingNow.find((x) => x.slug === el.dataset.workbar);
    el.innerHTML = w ? `<div class="notice work${claudeOn ? "" : " idle"}" style="margin:0 0 12px"><span><b>${esc(w.label)}…</b> sejak ${hhmm(w.since)} · perkiraan ${esc(etaText(w))}${claudeOn ? "" : `<br><span class="warn">${idleNote()}</span>`}</span></div>` : "";
  });
}
async function pollWorking() {
  const s = await fetchWorking();
  if (!s) return;
  for (const w of workingNow) if (!s.items.some((n) => n.slug === w.slug)) {
    $("#doneMsg").textContent = `Selesai · ${w.name}: ${w.next}.`;
    $("#doneLink").href = `#/v/${w.slug}`;
    $("#doneBox").hidden = false;
  }
  workingNow = s.items; claudeOn = s.claude;
  paintWork();
}

const b64ToU8 = (b) => { const s = atob((b + "===".slice((b.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, (c) => c.charCodeAt(0)); };
async function pushSetup() {
  const btn = $("#pushBtn");
  const r = await _fetch("/api/relay/vapid").catch(() => null);
  if (!r?.ok) return;
  const { key } = await r.json();
  if (!key) return;
  btn.hidden = false;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const reg = supported ? await navigator.serviceWorker.ready : null;
  let sub = reg ? await reg.pushManager.getSubscription() : null;
  const paint = () => { pushOn = !!sub && Notification.permission === "granted"; btn.classList.toggle("on", pushOn); btn.title = pushOn ? "Notifikasi aktif · tekan untuk tes" : "Aktifkan notifikasi"; };
  paint();
  btn.onclick = async () => {
    if (!supported) return alert(ios && !standalone ? "Di iPhone, notifikasi hanya jalan dari layar utama: tekan Share → Add to Home Screen, buka TERTORTOR dari ikon itu, lalu tekan lonceng ini lagi." : "Browser ini belum mendukung notifikasi push.");
    if (pushOn) {
      const t = await fetch("/api/relay/push-test", { method: "POST" });
      const j = await t.json().catch(() => ({}));
      return toast(j.sent ? "Notifikasi tes dikirim" : `Belum terkirim${j.note ? ": " + j.note : ""}`);
    }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Izin notifikasi ditolak; ubah di pengaturan browser");
    sub = sub || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) }));
    const sr = await fetch("/api/relay/push-subscribe", { method: "POST", body: JSON.stringify(sub) });
    if (!sr.ok) return toast("Gagal menyimpan langganan notifikasi");
    paint();
    toast("Notifikasi aktif. Tekan lonceng lagi untuk tes.");
  };
}

  const [ch, conf] = await Promise.all([fetch(`/api/buffer/channels?sub=${encodeURIComponent(sub.id)}`).then((r) => r.json()), fetch(`/api/subs/${cat.id}/${sub.id}/buffer`).then((r) => r.json())]);
  if (!$("#bufBox")) return;
  const viewer = me?.role === "viewer";
  // the API key of this sub's own Buffer account (user 2026-11-12): pasted here, kept on the laptop, shown only as ••••1234
  const keyForm = (replace) => viewer ? "" : `<div class="meta-row" style="gap:8px;margin-top:8px;flex-wrap:wrap" id="bufKeyRow">
      <input type="password" id="bufKey" autocomplete="off" spellcheck="false" placeholder="${replace ? "Tempel API key baru" : "Tempel API key Buffer"}" style="flex:1;min-width:220px">
      <button class="btn sm pri" id="bufKeySave">Simpan key</button>${replace ? '<button class="btn sm" id="bufKeyCancel">Batal</button>' : ""}</div>`;
  const keyLine = () => `<div class="meta-row" style="gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:8px"><span class="pill ok">API key ${esc(ch.hint)}</span>
      <span class="muted">${ch.source === "studio" ? `tersimpan di laptop${ch.at ? " · " + new Date(ch.at).toLocaleDateString("id-ID") : ""}` : `dari <span class="mono">.env</span> (${esc(ch.keyName)})`}</span>
      ${viewer ? "" : `<button class="btn sm" id="bufKeyNew">Ganti</button>${ch.source === "studio" ? '<button class="btn sm" id="bufKeyDel">Hapus key</button>' : ""}`}</div>`;
  const bindKey = () => {
    const save = $("#bufKeySave");
    if (save) save.onclick = async () => {
      const k = $("#bufKey").value.trim();
      if (!k) return toast("Tempel API key dulu");
      save.disabled = true;
      const r = await fetch(`/api/subs/${cat.id}/${sub.id}/buffer-key`, { method: "POST", body: JSON.stringify({ key: k }) });
      $("#bufKey").value = "";
      toast(r.ok ? "API key Buffer disimpan" : (await r.json()).error ?? "gagal");
      if (r.ok) bufferBox(cat, sub); else save.disabled = false;
    };
    if ($("#bufKeyCancel")) $("#bufKeyCancel").onclick = () => bufferBox(cat, sub);
    if ($("#bufKeyNew")) $("#bufKeyNew").onclick = () => { $("#bufKeyNew").closest(".meta-row").insertAdjacentHTML("afterend", keyForm(true)); $("#bufKeyNew").remove(); bindKey(); $("#bufKey").focus(); };
    if ($("#bufKeyDel")) $("#bufKeyDel").onclick = async () => {
      if (!confirm(`Hapus API key Buffer ${sub.label} dari laptop? Video channel ini tidak bisa dikirim ke Buffer sampai key diisi lagi.`)) return;
      const r = await fetch(`/api/subs/${cat.id}/${sub.id}/buffer-key`, { method: "DELETE" });
      toast(r.ok ? "API key dihapus" : (await r.json()).error ?? "gagal");
      bufferBox(cat, sub);
    };
  };
  if (!ch.key) {
    box.innerHTML = `<div class="eyebrow">Buffer</div><div class="muted" style="font-size:13px">Belum tersambung. Tiap channel punya akun Buffer sendiri: login ke akun Buffer ${esc(sub.label)}, buat API key di <a href="https://publish.buffer.com/settings/api" target="_blank" rel="noopener">publish.buffer.com/settings/api</a>, lalu tempel di sini. Key disimpan di laptop (tidak masuk git) dan setelah itu hanya tampil 4 karakter terakhirnya.</div>${keyForm(false)}`;
    return bindKey();
  }
  if (ch.error) { box.innerHTML = `<div class="eyebrow" style="margin-bottom:8px">Buffer · akun ${esc(sub.label)}</div>${keyLine()}<div class="notice" style="margin:4px 0 0"><span>${esc(ch.error)}</span></div>`; return bindKey(); }
  const on = new Set(conf.channels ?? []);
  box.innerHTML = `<div class="eyebrow" style="margin-bottom:8px">Buffer · akun ${esc(sub.label)} · video diteruskan ke</div>${keyLine()}
    ${ch.channels.length ?`<div class="meta-row" style="gap:8px 18px;flex-wrap:wrap">${ch.channels.map((c) => `<label style="display:flex;gap:8px;align-items:center;cursor:pointer">${c.avatar ? `<img src="${esc(c.avatar)}" alt="" style="width:22px;height:22px;border-radius:50%">` : ""}<input type="checkbox" data-buf="${esc(c.id)}" ${on.has(c.id) ? "checked" : ""}> ${esc(c.displayName || c.name)} <span class="pill">${esc(c.service)}</span>${c.isQueuePaused ? ' <span class="pill warn">antrean dijeda</span>' : ""}</label>`).join("")}</div>` : '<span class="muted">Akun Buffer ini belum punya channel.</span>'}
    <div class="meta-row" style="margin-top:10px;gap:10px"><select id="bufMode"><option value="addToQueue" ${conf.mode === "addToQueue" ? "selected" : ""}>Default: masuk antrean Buffer</option><option value="shareNow" ${conf.mode === "shareNow" ? "selected" : ""}>Default: terbitkan sekarang</option></select><button class="btn sm" id="bufSave">Simpan</button></div>`;
  bindKey();
  $("#bufSave").onclick = async () => {
    const channels = [...document.querySelectorAll("[data-buf]")].filter((x) => x.checked).map((x) => x.dataset.buf);
    const r = await fetch(`/api/subs/${cat.id}/${sub.id}/buffer`, { method: "POST", body: JSON.stringify({ channels, mode: $("#bufMode").value }) });
    toast(r.ok ? `Buffer: ${channels.length} channel tujuan disimpan` : (await r.json()).error);
  };
}
function viewSub(cat, sub, tab = "video", extra) {
  const list = videos.filter((v) => v.category === cat.id && v.sub === sub.id);
  const tabs = [["video", "Video", list.length], ["footage", "Library footage", ""], ...(cat.id === "storytelling" ? [["cerita", "Library cerita", ""]] : [])];
  if (!tabs.some((t) => t[0] === tab)) tab = "video";
  $("#main").innerHTML = `
    <div class="vh"><div><div class="eyebrow">${esc(cat.label)} · ${esc(cat.subLabel)}</div><h1>${esc(sub.label)}</h1><p>${esc(sub.description || cat.desc)}</p></div>
      <div class="vh-r">${sub.draft ? `<span class="pill">belum didesain</span>` : `<a class="btn pri" href="#/baru/${cat.id}/${esc(sub.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Buat video</a>`}</div></div>
    <div class="tabs">${tabs.map(([id, label, n]) => `<a class="${id === tab ? "on" : ""}" href="#/s/${cat.id}/${esc(sub.id)}${id === "video" ? "" : "/" + id}">${label}${n !== "" ? ` <span>${n}</span>` : ""}</a>`).join("")}</div>
    <div id="subBody"></div>`;
  if (!sub.draft) $(".tabs").insertAdjacentHTML("beforebegin", logoBox(cat, sub) + '<div class="panel pad" id="bufBox" style="margin-bottom:16px"><div class="eyebrow">Buffer</div><span class="muted" style="font-size:13px">Memuat…</span></div>');
  bindLogoBox(cat, sub, tab, extra);
  if (!sub.draft) bufferBox(cat, sub);
  const body = $("#subBody");
  if (tab === "footage") return viewLibrary({ category: cat.id, sub: sub.id }, body);
  if (tab === "cerita") return viewStories(sub.id, extra, body);
  body.innerHTML = (list.length ? `<div class="grid">${list.map(videoCard).join("")}</div>` : `<div class="empty"><b>Belum ada video di ${esc(sub.label)}</b>${sub.draft ? "Belum didesain, jadi belum bisa membuat proyek." : `<a class="btn pri" href="#/baru/${cat.id}/${esc(sub.id)}">Buat video</a>`}</div>`) + (sub.draft ? briefBox(sub) : "");
}

      const up = (f, kind) => fetch(`/api/videos/${j.slug}/upload?kind=${kind}&name=${encodeURIComponent(f.name)}`, { method: "PUT", body: f });
      await Promise.all([...files.ref.map((f) => up(f, "reference")), ...files.kv.map((f) => up(f, "keyvisuals"))]);
      // Docucine: files are in, now wake Claude to write the script (event docucine-new)
      if (preset.oneTake) await fetch(`/api/videos/${j.slug}/ready`, { method: "POST" });
      await loadVideos();
      location.hash = `#/v/${j.slug}`;
      if (preset.oneTake) showWorking(j.slug, true);
      toast(preset.oneTake ? "Video dibuat. Claude menulis naskahnya." : "Video dibuat. Salin perintahnya ke Claude.");
    } catch (err) { alert(err.message); go.disabled = false; go.textContent = "Buat video"; }
  };
}

// hear a Gemini speaker before picking it (user 2026-11-07): the same sample sentence for every speaker
function speakerPreview(voices) {
  const sel = $("#speaker");
  if (!sel || $("#spkPlay")) return;
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;gap:8px;align-items:center;margin-top:6px";
  wrap.innerHTML = '<button type="button" class="btn sm" id="spkPlay">▶ Dengar sampel</button><audio id="spkAudio" preload="none"></audio><span class="hint" id="spkNote" style="margin:0"></span>';
  sel.after(wrap);
  const a = $("#spkAudio"), b = $("#spkPlay");
  const cur = () => voices.find((v) => v.name === sel.value);
  const sync = () => { const v = cur(); b.disabled = !v?.sample; $("#spkNote").textContent = v?.sample ? "" : "sampel speaker ini belum dibuat"; a.pause(); b.textContent = "▶ Dengar sampel"; };
  b.onclick = () => { const v = cur(); if (!v?.sample) return; if (!a.paused && a.dataset.v === v.name) { a.pause(); b.textContent = "▶ Dengar sampel"; return; } a.src = v.sample; a.dataset.v = v.name; a.play(); b.textContent = "■ Stop"; };
  a.onended = () => (b.textContent = "▶ Dengar sampel");
  sel.addEventListener("change", sync);
  sync();
}

  let mine = [];
  const libStories = () => {
    const b = mine.find((x) => x.id === $("#libBook").value), free = (b?.stories ?? []).filter((s) => s.status === "baru");
    $("#libStory").innerHTML = free.length ? free.map((s) => `<option value="${esc(s.id)}">${esc(s.title)} · ±${s.estSeconds} s · ★${s.score}</option>`).join("") : '<option value="">semua kisah di sumber ini sudah dipakai</option>';
    const info = () => { const s = free.find((x) => x.id === $("#libStory").value); $("#libInfo").textContent = s ? s.summary : b && !b.chunks ? "Sumber ini belum selesai dipindai Gemini." : ""; };
    $("#libStory").onchange = info; info();
  };
  fetch("/api/stories").then((r) => r.json()).then(({ books }) => {
    mine = books.filter((b) => b.channel === ch.id);
    $("#libBook").innerHTML = mine.length ? mine.map((b) => `<option value="${esc(b.id)}">${esc(b.title)} · ${b.stories.filter((s) => s.status === "baru").length} kisah belum dipakai</option>`).join("") : '<option value="">Library Cerita channel ini masih kosong</option>';
    $("#libBook").onchange = libStories; libStories();
  });
  // the type's own default voice (brand.json → <type>.voice, BumiDiPijak = Kira)
  fetch("/api/voices?type=" + encodeURIComponent(type || "")).then((r) => r.json()).then(({ voices, speaker, style }) => {
    $("#speaker").innerHTML = voices.map((x) => `<option value="${esc(x.name)}" ${x.name === speaker ? "selected" : ""}>${esc(x.name)} · ${esc(x.desc)}${x.sample ? "" : " (belum ada sampel)"}</option>`).join("");
    if (style && !$("#vstyle").value) $("#vstyle").value = style;
    speakerPreview(voices);
  });
  // visual looks of this type (BKH PRESET1/PRESET2, user 2026-11-08)
  let looks = [];
  fetch("/api/looks?type=" + encodeURIComponent(type || "")).then((r) => r.json()).then((L) => {
    looks = L.looks; if (!looks.length) return;
    $("#lookFld").style.display = "";
    $("#lookSeg").innerHTML = looks.map((l) => `<label><input type="radio" name="look" value="${esc(l.id)}" ${l.id === L.defaultLook ? "checked" : ""}>${esc(l.label)}</label>`).join("");
    const hint = () => ($("#lookHint").textContent = looks.find((l) => l.id === document.querySelector("input[name=look]:checked")?.value)?.description ?? "");
    document.querySelectorAll("input[name=look]").forEach((x) => (x.onchange = hint)); hint();
  });
  let tokoh = [];
  const td = $("#tokohDrop");
  if (td) {
    const input = $("input", td);
    const take = (list) => {
      tokoh = [...tokoh, ...[...list].filter((f) => f.type.startsWith("image/"))];
      $("#tokohPrev").innerHTML = "";
      tokoh.forEach((f) => { const el = document.createElement("img"); el.src = URL.createObjectURL(f); $("#tokohPrev").appendChild(el); });
    };
    td.onclick = () => input.click();
    input.onchange = () => take(input.files);
    td.ondragover = (e) => { e.preventDefault(); td.classList.add("over"); };
    td.ondragleave = () => td.classList.remove("over");
    td.ondrop = (e) => { e.preventDefault(); td.classList.remove("over"); take(e.dataTransfer.files); };
  }
  $("#form").onsubmit = async (e) => {
    e.preventDefault();

    if (k === "text" && (!$("#story").value.trim() || !$("#title").value.trim())) return alert("Isi judul dan bahan mentahnya.");
    if (k === "lib" && !$("#libStory").value) return alert("Pilih satu kisah dari Library Cerita.");
    const go = $("#go"); go.disabled = true; go.textContent = k === "link" ? "Membaca artikel…" : "Menyimpan…";
    try {
      const src = k === "lib" ? { from: { book: $("#libBook").value, id: $("#libStory").value } } : k === "link" ? { title: $("#title").value, link: $("#link").value.trim() } : { title: $("#title").value, story: $("#story").value, source: $("#source").value };

    const take = (list) => {
      const ok = [...list].filter((f) => f.type.startsWith(AUDIO[key] ? "audio/" : "image/"));
      files[key] = key === "logo" || key === "music" ? ok.slice(0, 1) : [...files[key], ...ok];
      const box = $(`#${key}Prev`);
      box.innerHTML = "";
      files[key].forEach((f) => {
        if (AUDIO[key]) { const el = document.createElement("audio"); el.controls = true; el.src = URL.createObjectURL(f); el.title = f.name; el.style.width = "100%"; return box.appendChild(el); }
        const el = document.createElement("img"); el.src = URL.createObjectURL(f); box.appendChild(el);
      });
    };
    d.onclick = () => input.click();
    input.onchange = () => take(input.files);
    d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); take(e.dataTransfer.files); };
  });
  const pick = (n) => $(`input[name=${n}]:checked`).value;

    const m = pick("music") === "file", s = pick("sfx") === "mine";
    $("#musicFld").style.display = m ? "" : "none"; $("#sfxFld").style.display = s ? "" : "none"; $("#licFld").style.display = m || s ? "" : "none";
    $("#musicHint").style.display = m ? "none" : "";
  };
  document.querySelectorAll("input[name=music], input[name=sfx]").forEach((r) => (r.onchange = showAudio));
  showAudio();
  $("#form").onsubmit = async (e) => {
    e.preventDefault();
    const music = pick("music"), sfx = pick("sfx");
    if (music === "file" && !files.music.length) return alert("Masukkan file musiknya, atau pilih 'Tambah sendiri di aplikasi'.");
    if (sfx === "mine" && !files.sfx.length) return alert("Masukkan file SFX-nya, atau pilih SFX library.");
    if ((music === "file" || sfx === "mine") && !$("#lic").value.trim()) return alert("Tulis lisensi musik/SFX-nya.");
    if (music !== "file") files.music = [];
    if (sfx !== "mine") files.sfx = [];
    if (files.angle.length < 2) return alert("Masukkan minimal 2 foto produk dari angle berbeda.");
    if (!files.logo.length) return alert("Masukkan logo produk.");
    const go = $("#go"); go.disabled = true; go.textContent = "Menyimpan…";
    try {
      const r = await fetch("/api/videos", { method: "POST", body: JSON.stringify({ type: "advertisement", product: pr.id, name: $("#name").value, cta: $("#cta").value, notes: $("#notes").value, music, sfx, audioLicense: $("#lic").value }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      // one at a time: each upload is numbered (angle-1, angle-2…) in the order chosen
      for (const kind of ["angle", "logo", "model", "art", "music", "sfx"]) for (const f of files[kind]) {
        go.textContent = `Mengunggah ${f.name}…`;
        const u = await fetch(`/api/videos/${j.slug}/upload?kind=${kind}&name=${encodeURIComponent(f.name)}${AUDIO[kind] ? "&license=" + encodeURIComponent($("#lic").value) : ""}`, { method: "PUT", body: f });
        if (!u.ok) throw new Error((await u.json()).error);
      }
      await fetch(`/api/videos/${j.slug}/ready`, { method: "POST" });
      await loadVideos();
      location.hash = `#/v/${j.slug}`;
      toast("Iklan dibuat. Claude dibangunkan bila sesi sedang menunggu; kalau tidak, salin perintahnya.");
    } catch (err) { alert(err.message); go.disabled = false; go.textContent = "Buat iklan"; }
  };
}

              ${c.rawUrl ? `<video src="${c.rawUrl}" muted loop playsinline preload="metadata" style="width:100%;aspect-ratio:9/16;object-fit:cover" onmouseenter="this.play()" onmouseleave="this.pause()"></video>` : '<span class="muted" style="font-size:12px">belum di-generate</span>'}

              ${s.clipUrl ? `<video src="${s.clipUrl}" muted loop playsinline preload="metadata" style="width:100%;aspect-ratio:9/16;object-fit:cover" onmouseenter="this.play()" onmouseleave="this.pause()"></video>` : '<span class="muted" style="font-size:12px">belum ada klip</span>'}
              <div>${s.lines.map((l) => `<div style="margin-bottom:8px"><b>${esc(l.text)}</b><br><i style="color:var(--accent)">${esc(l.en)}</i></div>`).join("")}</div>

    konsep: () => {

      const picked = v.concept && c.concepts.find((k) => k.id === v.concept.id);

            <span style="margin-left:auto">${picked?.id === k.id ? '<span class="pill acc">dipilih</span>' : `<button class="btn ${k.recommended ? "pri " : ""}sm" data-concept="${esc(k.id)}">Pilih konsep ini</button>`}</span></div>
          <div class="shot-b"><dl class="kv">

      const g = (title, items) => items.length ? `<div class="eyebrow sub">${title}</div><div class="gal">${items.map((u) => `<a href="${u}" target="_blank"><img src="${u}" alt="" loading="lazy"></a>`).join("")}</div>` : "";
      return `<div class="pad">${run}${cards}
        ${v.refAnalysis ? `<div class="eyebrow sub">Analisis Claude (5 aspek)</div><div class="doc" style="font-size:13px">${esc(v.refAnalysis)}</div>` : ""}
        ${g("Satu gambar per shot", v.refShots)}${g("Ritme (1 tile = 1 detik)", v.refSheets)}

          ${t.backgrounds.length ? `<div class="fld"><span class="lb">Latar</span><div class="meta-row" style="gap:8px;flex-wrap:wrap">${t.backgrounds.map((b) => `<label style="cursor:pointer"><input type="radio" name="thBg" value="${esc(b.path)}" ${b.path === t.bg ? "checked" : ""} hidden><img src="${b.url}" alt="" loading="lazy" style="width:64px;height:114px;object-fit:cover;border-radius:6px;outline:${ring(b.path === t.bg)}"></label>`).join("")}</div></div>` : '<p class="muted" style="font-size:12.5px">Latar: frame dari render (belum ada key visual).</p>'}

        ? `<div class="notice ok"><span><b>Breakdown disetujui</b> · ${new Date(ap.at).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" })}${run ? ` · Claude membuat key visual dan klip sejak ${hhmm(run.since)}` : ""}</span><span class="sp"><button class="btn sm" id="clUnapprove">Batalkan</button></span></div>`
        : `<div class="notice"><span>${ap.stale ? "<b>Breakdown berubah setelah disetujui.</b> Setujui lagi sebelum generate." : ready ? `<b>Breakdown menunggu persetujuanmu.</b> Setelah disetujui, Claude membuat ${c.clips.length} key visual di Flow lalu ${c.clips.length} generate H3 (koin RunningHub), lalu merakitnya.` : "<b>Claude sedang menulis breakdown.</b> Tombol setujui aktif setelah semua shot punya analisis dan prompt."}</span><span class="sp"><button class="btn pri sm" id="clApprove" ${ready ? "" : "disabled"}>Setujui breakdown</button></span></div>`;
      const issues = c.errors.slice(0, 12).map((e) => `<li class="e">✗ ${esc(e)}</li>`).join("") + (c.errors.length > 12 ? `<li class="e">… ${c.errors.length - 12} lagi</li>` : "") + c.warns.map((w) => `<li class="w">⚠ ${esc(w)}</li>`).join("");

            </div>
            ${s.needsImage && s.kv ? `<div class="prompt"><span class="lb">Key visual (Flow, ${esc(c.format.aspect)})</span><button class="btn sm" data-copy="${esc(s.kv)}">Salin</button>${esc(s.kv)}</div>` : ""}

            <div class="prompt"><span class="lb">Gerak</span>${esc(s.motion || "–")}</div>

        <div class="eyebrow sub">Generate H3 · ${c.clips.length} generate</div>

          <div class="shot-b">
            <div class="row" style="grid-template-columns:${cols(2)}">
              ${media(x.frameUrl, false, `LOAD IMAGE: key visual ${esc(x.shots[0])}`)}

              <div class="muted" style="font-size:12.5px;${wide ? "grid-column:1/-1" : ""}">RunningHub H3: LOAD IMAGE = key visual ${esc(x.shots[0])}, PROMPT di bawah, RATIO ${esc(c.format.aspect)}, DURASI ${x.seconds}. Setelah unduh: <span class="mono">node tools/cinemaclone.mjs add ${esc(slug)} clip ${esc(x.id)} &lt;file&gt;</span></div>
