  if ($("#delBtn")) $("#delBtn").onclick = () => {
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = `<div class="panel pad" style="max-width:480px;width:100%"><div class="eyebrow">Hapus video</div>
      <p style="margin:10px 0">Proyek <b>${esc(v.title)}</b> dipindah ke Sampah: hilang dari daftar, tapi masih bisa dipulihkan dari menu Sampah.${v.share ? " Link berbagi tetap hidup sampai kamu mencabutnya." : ""}</p>
      <div class="fld"><label for="delSlug">Ketik slug untuk konfirmasi: <span class="mono" style="text-transform:none">${esc(slug)}</span></label><input type="text" id="delSlug" autocomplete="off" spellcheck="false"></div>
      <div class="meta-row" style="justify-content:flex-end"><button class="btn" id="delNo">Batal</button><button class="btn pri" id="delGo" disabled style="background:var(--bad);border-color:var(--bad)">Hapus</button></div></div>`;
    document.body.appendChild(box);
    const inp = $("#delSlug", box), go = $("#delGo", box);
    inp.focus();
    inp.oninput = () => (go.disabled = inp.value.trim() !== slug);
    $("#delNo", box).onclick = () => box.remove();
    go.onclick = async () => {
      go.disabled = true; go.textContent = "Menghapus…";
      // let go of the video first: on Windows an open file keeps the whole folder from moving
      document.querySelectorAll("video").forEach((x) => { x.pause(); x.removeAttribute("src"); x.load(); });
      await new Promise((ok) => setTimeout(ok, 600));
      const r = await fetch(`/api/videos/${slug}/delete`, { method: "POST", body: JSON.stringify({ confirm: inp.value.trim() }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast(j.error ?? "gagal"); go.disabled = false; go.textContent = "Hapus"; return; }
      box.remove(); toast("Video dipindah ke Sampah");
      location.hash = v.sub ? `#/s/${v.category}/${v.sub}` : "#/";
    };
  };
  // the link under the player: shows the URL when there is one, otherwise opens the "Bagikan" dialog to make it
  if ($("#linkBtn")) $("#linkBtn").onclick = () => {
    const box = $("#linkBox");
    if (!v.share) return $("#shareBtn").click();
    box.hidden = !box.hidden;
    $("#linkBtn").textContent = box.hidden ? "Lihat link video" : "Sembunyikan link";
    if (!box.hidden) box.querySelector("input").select();
  };
  $("#linkBox [data-copy]")?.addEventListener("click", () => { const i = $("#linkBox input"); if (copyText(i.value)) toast("Link disalin"); else { i.select(); toast("Browser menolak menyalin. Link sudah diblok, tekan Ctrl+C."); } });
  // share by link (tools/share.mjs → relay /v/<token>): only people who have the link can watch it
  if ($("#shareBtn")) $("#shareBtn").onclick = () => {
    const box = document.createElement("div");
    box.className = "modal";
    const draw = (sh, busy = "") => {
      box.innerHTML = `<div class="panel pad" style="max-width:520px;width:100%"><div class="eyebrow">Bagikan lewat link</div>
        ${sh ? `<p style="margin:10px 0 6px">Siapa pun yang punya link ini bisa memutar video tanpa login, juga saat laptop mati. Link tidak muncul di mana pun.</p>
          <div class="meta-row" style="margin:10px 0"><input id="shareUrl" readonly value="${esc(sh.url)}" style="flex:1;min-width:0"><button class="btn" data-copy>Salin</button></div>
          <p class="muted" style="font-size:12.5px">${(sh.size / 1e6).toFixed(1)} MB · dibuat ${new Date(sh.at).toLocaleString("id-ID")}${sh.stale ? ` · <b style="color:var(--warn,#d9a13a)">link masih memutar render lama</b>` : ""}. Penonton tetap bisa mengunduh atau meneruskan videonya.</p>`
        : `<p style="margin:10px 0">Render dikompres (±50 MB untuk 2 menit) lalu disimpan di server TERTORTOR. Siapa pun yang punya linknya bisa memutar video tanpa login. Linknya bisa dicabut kapan saja.</p>`}
        ${busy ? `<p class="muted" style="margin-top:10px">${busy}</p>` : ""}
        <div class="meta-row" style="justify-content:flex-end;margin-top:12px">${sh ? `<button class="btn" data-revoke ${busy ? "disabled" : ""}>Cabut link</button>` : ""}<button class="btn" data-x>Tutup</button>${!sh || sh.stale ? `<button class="btn pri" data-make ${busy ? "disabled" : ""}>${sh ? "Perbarui ke render terbaru" : "Buat link"}</button>` : ""}</div></div>`;
      box.querySelector("[data-x]").onclick = () => { box.remove(); if (sh !== v.share) viewEditor(slug, document.querySelector("#tabs button.on")?.dataset.t); };
      box.querySelector("[data-copy]")?.addEventListener("click", () => { if (copyText(sh.url)) toast("Link disalin"); else { box.querySelector("#shareUrl").select(); toast("Browser menolak menyalin. Link sudah diblok, tekan Ctrl+C."); } });
      box.querySelector("[data-make]")?.addEventListener("click", async () => {
        draw(sh, "Mengompres dan mengunggah… biasanya 1-3 menit. Dialog ini boleh ditutup, unggahan jalan terus di laptop.");
        const json = async (r) => { try { return await r.json(); } catch { return { error: `server menjawab ${r.status}` }; } };
        let r = await json(await fetch(`/api/videos/${slug}/share`, { method: "POST" }).catch((e) => ({ json: async () => ({ error: e.message }) })));
        // the upload runs in the background; ask every 5 s until the link is there
        while (!r.error && r.busy && document.body.contains(box)) {
          await new Promise((ok) => setTimeout(ok, 5000));
          const nv = await json(await fetch(`/api/videos/${slug}`).catch(() => ({ json: async () => ({}) })));
          r = nv.shareJob ? { busy: nv.shareJob.busy, error: nv.shareJob.error, share: nv.share } : nv.share && nv.share !== sh ? { share: nv.share } : { busy: !nv.share || nv.share.at === sh?.at };
        }
        if (r.error) return draw(sh, `Gagal: ${esc(r.error)}`);
        if (r.share) { v.share = r.share; draw(r.share); toast("Link siap"); }
      });
      box.querySelector("[data-revoke]")?.addEventListener("click", async () => {
        if (!confirm("Cabut link ini? Orang yang sudah punya link tidak bisa memutarnya lagi.")) return;
        const r = await (await fetch(`/api/videos/${slug}/share`, { method: "DELETE" })).json().catch((e) => ({ error: e.message }));
        if (r.error) return draw(sh, `Gagal: ${esc(r.error)}`);
        draw(null);
      });
    };
    document.body.appendChild(box);
    draw(v.share);
  };
  if ($("#presetBtn")) $("#presetBtn").onclick = async () => {
    const { presets } = await (await fetch("/api/presets")).json();
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = `<div class="panel pad" style="max-width:560px;width:100%"><div class="eyebrow">Preset gaya untuk video ini</div><div class="presets" style="margin:12px 0">${presets.map((p) => presetCard(p, p.id === v.preset)).join("")}</div>
      <div class="eyebrow" style="margin-top:4px">Color tone</div><div id="toneBox" style="margin:10px 0 12px"></div>
      <p class="muted" style="font-size:12.5px">Warna, font, dan caption langsung ikut. Scene yang sudah didesain tetap memakai tata letaknya; minta Claude mendesain ulang untuk gaya penuh.</p>
      <div class="meta-row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-x>Batal</button><button class="btn pri" data-ok>Pakai preset</button></div></div>`;
    document.body.appendChild(box);
    const drawTones = () => { const p = presets.find((x) => x.id === box.querySelector("input[name=preset]:checked")?.value) ?? presets[0]; box.querySelector("#toneBox").innerHTML = toneRow(p, p.id === v.preset ? v.accent : null); };
    box.querySelectorAll("input[name=preset]").forEach((r) => (r.onchange = drawTones));
    drawTones();
    box.querySelector("[data-x]").onclick = () => box.remove();
    box.querySelector("[data-ok]").onclick = async () => {
      const id = box.querySelector("input[name=preset]:checked")?.value;
      const r = await fetch(`/api/videos/${slug}/preset`, { method: "POST", body: JSON.stringify({ preset: id, accent: toneVal(box) }) });
      box.remove(); if (r.ok) { toast("Preset: " + id); await loadVideos(); viewEditor(slug); }
    };
  };
  openTab(startTab || (v.clone ? "clone" : isM ? (v.waiting === "Setujui draft" || v.musafo.draftApproval.needed && !v.musafo.draftApproval.approved ? "draft" : v.waiting === "Setujui storyline" || !v.musafo.storylineApproval.approved && !v.musafo.shots.length ? "storyline" : v.scriptState === "waiting" || v.scriptState === "stale" ? "naskah" : v.beats.length ? "beat" : "shot") : hasRef && !v.concept && v.scriptState === "none" ? "konsep" : v.scriptState === "waiting" || v.scriptState === "stale" ? "naskah" : !v.oneTake && v.approval.approved && (!v.flowCheck.shots.length || v.flowCheck.errors.length) && !v.beats.length ? "flow" : "beat"));
  paintWork(); // banner if Claude is working on this project
}

// ---------- Musafo story library: a long book -> stories ready to become videos one by one ----------
// Library Cerita of one Storytelling channel, drawn inside that channel's page (#/s/storytelling/<id>/cerita[/<book>])
async function viewStories(chSel, bookSel, host = $("#main")) {
  const { job, channels, books: allBooks } = await (await fetch("/api/stories")).json();
  const ch = channels.find((c) => c.id === chSel) ?? channels[0];
  const books = allBooks.filter((b) => b.channel === ch.id);
  const cur = books.find((b) => b.id === bookSel) ?? books[0];
  const bkh = ch.type === "berakitkehulu";
  // a chronicle channel (BumiDiPijak, user 2026-11-07: channels.json → order "page") lists stories in book order = time order
  const byPage = ch.order === "page";
  const base = `#/s/storytelling/${ch.id}/cerita`;
  host.innerHTML = `
    <p class="muted" style="margin:0 0 16px">Unggah buku (PDF), tempel link artikel, atau tempel teks. Gemini membacanya per 20 halaman dan mencatat setiap kisah yang bisa jadi video: ringkasan, alur, tokoh, ${bkh ? "merek, kutipan tokoh" : "dalil"} persis dari teks, dan halaman sumbernya. Pilih satu kisah, jadikan video${bkh ? " Berakit ke Hulu" : ""}.</p>
    ${job ? `<div class="notice ${job.state === "done" ? "ok" : ""}"><span><b>${esc(job.label)}</b> · ${job.state === "running" ? "sedang berjalan" : job.state === "done" ? "selesai" : "gagal"} · ${esc(job.line)}</span>${job.state === "running" ? '<span class="sp"><button class="btn sm" data-reload>Muat ulang</button></span>' : ""}</div>` : ""}
    <div class="form-grid" style="margin-bottom:20px">
      <div class="panel pad">
        <div class="eyebrow" style="margin-bottom:10px">Tambah sumber ke ${esc(ch.label)}</div>
        <span class="seg" style="margin-bottom:10px"><label><input type="radio" name="src" value="pdf" checked>PDF</label><label><input type="radio" name="src" value="url">Link artikel</label><label><input type="radio" name="src" value="text">Tempel teks</label></span>
        <div data-src="pdf"><div class="drop" id="pdfDrop"><span id="pdfName">Tarik PDF ke sini atau klik</span><input type="file" accept="application/pdf"></div></div>
        <div data-src="url" hidden><div class="fld"><label for="srcUrl">Link</label><input type="text" id="srcUrl" placeholder="https://disway.id/…"></div></div>
        <div data-src="text" hidden><div class="fld"><label for="srcText">Teks</label><textarea id="srcText" rows="8" placeholder="Tempel artikel, catatan, atau kutipan buku di sini"></textarea></div></div>
        <div class="two" style="margin-top:10px"><div class="fld"><label for="bTitle">Judul</label><input type="text" id="bTitle" placeholder="opsional"></div><div class="fld"><label for="bAuthor">Penulis</label><input type="text" id="bAuthor" placeholder="opsional"></div></div>
        <button class="btn pri" id="pdfGo" disabled>Baca</button>
        <p class="muted" style="font-size:12.5px;margin-top:8px">Sumber disimpan di <span class="mono">musafo/sumber</span> dan <span class="mono">musafo/library</span> (teksnya tidak masuk git). PDF hasil scan (gambar) perlu OCR dulu. Link: judul diambil dari halamannya bila dikosongkan.</p>
      </div>
      <div class="panel pad">
        <div class="eyebrow" style="margin-bottom:10px">Buku &amp; artikel</div>
        ${books.length ? books.map((b) => `<div class="meta-row" style="margin-bottom:8px"><a class="btn sm ${b.id === cur?.id ? "pri" : ""}" href="${base}/${b.id}">${esc(b.title)}</a><span class="muted" style="font-size:12.5px">${b.kind === "link" ? "link · " : b.kind === "teks" ? "teks · " : ""}${b.pages} ${b.kind ? "bagian" : "hal"} · ${b.stories.length} kisah · ${b.stories.filter((s) => s.status !== "baru").length} dipakai</span></div>`).join("") : `<span class="muted">Belum ada buku di ${esc(ch.label)}.</span>`}
      </div>
    </div>
    ${cur ? `<div class="meta-row" style="margin-bottom:12px"><input type="search" id="sq" placeholder="Cari kisah, tokoh, dalil… (semua buku ${esc(ch.label)})" style="flex:1 1 260px;min-width:200px"><span class="seg"><label><input type="radio" name="sf" value="baru" checked>Belum dipakai</label><label><input type="radio" name="sf" value="all">Semua</label></span>
      <span class="seg"><label><input type="radio" name="so" value="score" ${byPage ? "" : "checked"}>Skor</label><label><input type="radio" name="so" value="page" ${byPage ? "checked" : ""}>Halaman</label></span>
      <button class="btn sm" id="rescan" style="margin-left:auto">Pindai ulang yang belum</button></div>
      <div id="storyList"></div>` : ""}`;
  const rl = document.querySelector("[data-reload]");
  if (rl) rl.onclick = () => viewStories(ch.id, cur?.id, host);
  const drop = $("#pdfDrop"), input = $("input", drop);
  let file = null;
  const src = () => $("input[name=src]:checked").value;
  const ready = () => { $("#pdfGo").disabled = src() === "pdf" ? !file : src() === "url" ? !/^https?:\/\/\S+$/i.test($("#srcUrl").value.trim()) : $("#srcText").value.trim().length < 300; };
  document.querySelectorAll("input[name=src]").forEach((r) => (r.onchange = () => { document.querySelectorAll("[data-src]").forEach((d) => (d.hidden = d.dataset.src !== src())); ready(); }));
  $("#srcUrl").oninput = ready;
  $("#srcText").oninput = ready;
  const take = (f) => {
    file = f?.[0];
    if (!file) return;
    $("#pdfName").textContent = file.name;
    $("#pdfGo").disabled = false;
    if (!$("#bTitle").value) $("#bTitle").value = file.name.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ");
  };
  drop.onclick = () => input.click();
  input.onchange = () => take(input.files);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files); };
  $("#pdfGo").onclick = async () => {
    if (src() !== "pdf") {
      if (src() === "text" && !$("#bTitle").value.trim()) return toast("Isi judul untuk teks tempelan.");
      $("#pdfGo").disabled = true; $("#pdfGo").textContent = "Mengirim…";
      const r = await fetch("/api/stories/source", { method: "POST", body: JSON.stringify({ channel: ch.id, title: $("#bTitle").value, author: $("#bAuthor").value, ...(src() === "url" ? { url: $("#srcUrl").value.trim() } : { text: $("#srcText").value }) }) });
      if (!r.ok) { toast((await r.json()).error); $("#pdfGo").disabled = false; $("#pdfGo").textContent = "Baca"; return; }
      toast("Sumber sedang dibaca. Kisahnya muncul di daftar sebentar lagi."); return viewStories(ch.id, undefined, host);
    }
    $("#pdfGo").disabled = true; $("#pdfGo").textContent = "Mengunggah…";
    const r = await fetch(`/api/stories/upload?name=${encodeURIComponent(file.name)}&title=${encodeURIComponent($("#bTitle").value)}&author=${encodeURIComponent($("#bAuthor").value)}&channel=${ch.id}`, { method: "PUT", body: file });
    if (!r.ok) { toast((await r.json()).error); $("#pdfGo").disabled = false; $("#pdfGo").textContent = "Baca"; return; }
    toast("Buku sedang dibaca. Buku tebal bisa makan beberapa menit."); viewStories(ch.id, undefined, host);
  };
  if (!cur) return;
  $("#rescan").onclick = async () => { const r = await fetch("/api/stories/scan", { method: "POST", body: JSON.stringify({ book: cur.id }) }); toast(r.ok ? "Pemindaian dimulai" : (await r.json()).error); viewStories(ch.id, cur.id, host); };
  const PER = 10;
  let page = 0;
  const pager = (n) => {
    const total = Math.ceil(n / PER);
    if (total < 2) return "";
    const nums = [...Array(total).keys()].filter((i) => total <= 9 || i < 2 || i >= total - 2 || Math.abs(i - page) <= 1);
    return `<div class="meta-row" style="justify-content:center;margin:12px 0">
      <button class="btn sm" data-pg="${page - 1}" ${page ? "" : "disabled"}>‹</button>
      ${nums.map((i, k) => (k && i - nums[k - 1] > 1 ? '<span class="muted">…</span>' : "") + `<button class="btn sm ${i === page ? "pri" : ""}" data-pg="${i}">${i + 1}</button>`).join("")}
      <button class="btn sm" data-pg="${page + 1}" ${page < total - 1 ? "" : "disabled"}>›</button>
      <span class="muted" style="font-size:12.5px">${page * PER + 1}–${Math.min(n, (page + 1) * PER)} dari ${n}</span></div>`;
  };
  // search runs over every book of this channel; without a query the list is the open book
  const fold = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const hay = (s) => fold([s.id, s.title, s.summary, s.notes, s.brand, s.era, ...Object.values(s.arc ?? {}), ...(s.figures ?? []).map((x) => x.name),
    ...(s.dalil ?? []).flatMap((d) => [d.text, d.ref]), ...(s.quotes ?? []).flatMap((q) => [q.text, q.who])].join(" "));
  // book.startPage: where the text itself begins; stories from the front matter (translator's introduction) are not part
  // of the story's timeline, so in page order they go after the last chapter, tagged "pengantar"
  const intro = (s) => s._book.startPage && s.pages[0] < s._book.startPage;
  const pageKey = (s) => s.pages[0] + (intro(s) ? 1e6 : 0);
  const render = () => {
    const f = $("input[name=sf]:checked").value, so = $("input[name=so]:checked").value;
    const words = fold($("#sq").value).split(/\s+/).filter(Boolean);
    const pool = (words.length ? books : [cur]).flatMap((b) => b.stories.map((s) => ({ ...s, _book: b })));
    const list = pool.filter((s) => (f === "all" || s.status === "baru") && words.every((w) => hay(s).includes(w)))
      .sort((a, b) => so === "page" && a._book === b._book ? pageKey(a) - pageKey(b) : b.score - a.score || a.pages[0] - b.pages[0]);
    page = Math.max(0, Math.min(page, Math.ceil(list.length / PER) - 1));
    $("#storyList").innerHTML = list.length ? pager(list.length) + list.slice(page * PER, (page + 1) * PER).map((s) => `<div class="shot">
      <div class="shot-h"><b>${esc(s.id)} · ${esc(s.title)}</b>${words.length && books.length > 1 ? `<span class="pill">${esc(s._book.title)}</span>` : ""}<span class="pill">hal. ${s.pages[0] === s.pages[1] ? s.pages[0] : s.pages.join("–")}</span>${intro(s) ? '<span class="pill warn">pengantar</span>' : byPage && s.era ? `<span class="pill">${esc(s.era)}</span>` : ""}${typeof s.legend === "boolean" ? `<span class="pill">${s.legend ? "legenda" : "sejarah"}</span>` : ""}<span class="pill acc">★ ${s.score}</span><span class="pill">±${s.estSeconds}s${s.parts > 1 ? " · series " + s.parts + " bagian" : ""}</span>${s.partial ? '<span class="pill warn">terpotong</span>' : ""}
        <span style="margin-left:auto">${s.project ? `<a class="btn sm" href="#/v/${esc(s.project)}">Buka proyek</a>` : `<button class="btn pri sm" data-use="${esc(s.id)}" data-book="${esc(s._book.id)}">Jadikan video</button>`}</span></div>
      <div class="shot-b"><div>${esc(s.summary)}</div>
        <dl class="kv" style="margin-top:10px">${s.arc ? `<dt>Alur</dt><dd>${esc(s.arc?.pembuka)} → ${esc(s.arc?.konflik)} → ${esc(s.arc?.titikBalik)} → ${esc(s.arc?.pelajaran)}</dd>` : ""}
        ${s.original ? `<dt>Cerita asli</dt><dd>${esc(s.original)}${s.originalVerified === false ? ' <span class="pill warn">cek manual</span>' : ""}</dd>` : ""}
        ${s.habit ? `<dt>Kebiasaan</dt><dd>${esc(s.habit)}</dd>` : ""}
        ${s.figures?.length ? `<dt>Tokoh</dt><dd>${s.figures.map((x) => esc(x.name) + (x.prophet ? " ⚠" : "")).join(", ")}</dd>` : ""}
        ${s.dalil?.length ? `<dt>Dalil</dt><dd>${s.dalil.map((d) => `${esc(d.text)} <span class="muted">(${esc(d.ref)})</span>${d.verified ? "" : ' <span class="pill warn">cek manual</span>'}`).join("<br>")}</dd>` : ""}
        ${s.brand ? `<dt>Merek</dt><dd>${esc(s.brand)}${s.era ? ` <span class="muted">(${esc(s.era)})</span>` : ""}</dd>` : ""}
        ${s.quotes?.length ? `<dt>Kutipan</dt><dd>${s.quotes.map((q) => `"${esc(q.text)}" <span class="muted">(${esc(q.who)}, hal. ${q.page})</span>${q.verified ? "" : ' <span class="pill warn">cek manual</span>'}`).join("<br>")}</dd>` : ""}
        ${s.notes ? `<dt>Catatan</dt><dd>${esc(s.notes)}</dd>` : ""}
        <dt>Nilai</dt><dd>menyentuh ${s.emotion} · visual ${s.visual} · jelas ${s.clarity}</dd></dl></div></div>`).join("") + pager(list.length)
      : words.length ? `<div class="empty"><b>Tidak ada yang cocok</b>Coba kata lain, atau pilih "Semua" untuk ikut mencari kisah yang sudah dipakai.</div>`
      : '<div class="empty"><b>Tidak ada kisah</b>Semua sudah dipakai, atau buku belum selesai dipindai.</div>';
    document.querySelectorAll("[data-pg]").forEach((b) => (b.onclick = () => { page = +b.dataset.pg; render(); $("#storyList").scrollIntoView({ behavior: "smooth" }); }));
    document.querySelectorAll("[data-use]").forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      const r = await fetch("/api/stories/use", { method: "POST", body: JSON.stringify({ book: b.dataset.book, id: b.dataset.use }) });
      const j = await r.json(); if (!r.ok) { b.disabled = false; return toast(j.error); }
      await loadVideos(); location.hash = `#/v/${j.slug}`; toast(`Proyek ${STORY[ch.type]?.label ?? "Musafo"} dibuat. Claude menyusun storyline-nya.`);
    }));
  };
  document.querySelectorAll("input[name=sf], input[name=so]").forEach((x) => (x.onchange = () => { page = 0; render(); }));
  $("#sq").oninput = () => { page = 0; render(); };
  render();
}

// footage of one preset/channel/product: clips filed there (library add --for) or used by its projects.
// Without a place (old #/library link) it is the whole library.
async function viewLibrary(place, host = $("#main")) {
  const [all, audioAll] = await Promise.all([fetch("/api/library").then((r) => r.json()), fetch("/api/audio").then((r) => r.json())]);
  const here = (x) => !place || x.places.some((p) => p.category === place.category && p.sub === place.sub);
  const audio = audioAll.filter((x) => here(x) || !x.places.length);
  const clips = place ? all.filter((c) => c.places.some((p) => p.category === place.category && p.sub === place.sub)) : all;
  const loose = place ? all.filter((c) => !c.places.length) : [];
  host.innerHTML = `
    ${place ? "" : `<div class="vh"><div><div class="eyebrow">Database footage</div><h1>Semua footage</h1></div></div>`}
    <div class="meta-row" style="margin-bottom:12px"><span class="muted" style="font-size:13px">Footage dari Google Flow dan stock gratis. Dibuat sekali, dipakai berkali-kali, dan bisa diekspor sebagai stock video. Tambah langsung ke sini: <span class="mono">npm run library -- add … --for ${esc(place ? place.category + "/" + place.sub : "<kategori>/<sub>")}</span></span>
      <span class="sp"></span><span class="pill">${clips.length} clip</span><span class="pill acc">${clips.filter((c) => /flow|ai|wavespeed/i.test(c.source)).length} milikmu</span></div>
    ${loose.length ? `<div class="notice"><span><b>${loose.length} clip belum punya channel</b> (belum dipakai dan tanpa --for). Ditampilkan di bawah supaya tetap bisa dipakai.</span></div>` : ""}
    <input type="text" class="search" id="q" placeholder="Cari: malam, tangan, hp, cctv…">
    <div class="grid" id="lib"></div>
    <div class="grp-h"><h2>Musik &amp; SFX</h2><small>${audio.length} file · stok gratis berlisensi (Mixkit, Freesound, Coverr) lewat <span class="mono">npm run stock</span></small></div>
    ${audio.length ? audio.map((x) => `<div class="meta-row" style="margin-bottom:8px"><span class="pill ${x.kind === "music" ? "acc" : ""}">${x.kind}</span><b style="font-size:13px">${esc(x.title)}</b><audio controls preload="none" src="/files/library/${esc(x.file)}" style="height:32px"></audio><span class="muted" style="font-size:12px">${x.duration}s · ${esc(x.source)} · ${esc(x.license)}${x.by ? " · " + esc(x.by) : ""} · dipakai ${x.usedIn.length}×${x.places.length ? "" : " · belum punya channel"}</span></div>`).join("")
      : `<div class="empty"><b>Belum ada musik atau SFX stok</b>Unduh item berlisensi bebas dari Mixkit (Free License) atau Freesound (CC0 / CC BY), lalu: <span class="mono">npm run stock -- add &lt;file&gt; --kind music|sfx --source mixkit|freesound --url &lt;halaman item&gt; --license "&lt;lisensi&gt;" --for ${esc(place ? place.category + "/" + place.sub : "<kategori>/<sub>")}</span></div>`}`;
  const render = () => {
    const q = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = [...clips, ...loose].filter((c) => q.every((w) => `${c.prompt} ${c.tags.join(" ")}`.toLowerCase().includes(w)));
    $("#lib").innerHTML = hit.length ? hit.map((c) => `
      <div class="clip"><video src="/files/library/${c.file}" muted loop preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()"></video>
      <div><b>${esc(c.tags.slice(0, 3).join(" · ") || c.id)}</b><br>${c.duration}s · ${esc(c.source)} · dipakai ${c.usedIn.length}×</div></div>`).join("")
      : `<div class="empty" style="grid-column:1/-1"><b>${clips.length ? "Tidak ada yang cocok" : "Library masih kosong"}</b>${clips.length ? "Coba kata kunci lain." : "Footage yang dibuat Claude di Google Flow otomatis masuk ke sini."}</div>`;
  };
  $("#q").oninput = render; render();
}

// ---------- users by invitation (user 2026-11-09) ----------
// Accounts live on the web relay (tools/relay.mjs). An admin invites by email: a one-time link that expires; the
// person picks their own password at /join/…. Here: invite, see who is in, change a role, revoke/restore, delete.
const ROLE_LB = { admin: "Admin", editor: "Editor", viewer: "Viewer" };
const ROLE_HINT = { admin: "semua + kelola user", editor: "semua kecuali kelola user", viewer: "hanya melihat" };
const when = (d) => (d ? new Date(d).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" }) : "–");
// deleted videos (videos/.trash, "Hapus video" in the editor): restore puts the folder back under its slug
async function viewTrash() {
  const items = await fetch("/api/trash").then((r) => r.json()).catch(() => []);
  $("#main").innerHTML = `<div class="vh"><div><div class="eyebrow">Produksi</div><h1>Sampah</h1><p>Video yang dihapus dari editor. Foldernya masih utuh di laptop (<span class="mono">videos/.trash/</span>) dan bisa dipulihkan.</p></div></div>
    ${items.length ? `<div class="panel">${items.map((t) => `<div class="meta-row" style="justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)">
      <div><b>${esc(t.title)}</b><div class="muted mono" style="font-size:12px">${esc(t.slug)} · dihapus ${new Date(t.at).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" })}</div></div>
      ${me?.role === "viewer" ? "" : t.taken ? '<span class="pill warn">slug sudah dipakai video lain</span>' : `<button class="btn sm" data-restore="${esc(t.id)}">Pulihkan</button>`}</div>`).join("")}</div>`
    : '<div class="empty"><b>Sampah kosong</b></div>'}`;
  document.querySelectorAll("[data-restore]").forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    const r = await fetch(`/api/trash/${b.dataset.restore}/restore`, { method: "POST" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.error ?? "gagal"); b.disabled = false; return; }
    toast("Video dipulihkan"); location.hash = `#/v/${j.slug}`;
  }));
}
async function viewUsers() {
  const main = $("#main");
  main.innerHTML = `<div class="vh"><div><div class="eyebrow">Akses web</div><h1>User</h1></div></div><div id="ub"><span class="muted">Memuat…</span></div>`;
  const r = await fetch("/api/users"), d = await r.json().catch(() => ({}));
  if (!r.ok) return void ($("#ub").innerHTML = `<div class="empty"><b>User tidak bisa dimuat</b>${esc(d.error || r.status)}</div>`);
  const roleSel = (id, cur) => `<select class="sel" ${id} style="width:auto;padding:5px 8px">${d.roles.map((x) => `<option value="${x}" ${x === cur ? "selected" : ""}>${ROLE_LB[x]}</option>`).join("")}</select>`;
  const row = (cells, acts = "") => `<div class="meta-row" style="align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)">${cells}<span class="sp" style="flex:1"></span>${acts}</div>`;
  $("#ub").innerHTML = `
    ${d.mail ? "" : `<div class="notice"><span><b>Email belum diatur di relay.</b> Undangan tetap dibuat dan linknya muncul di sini untuk kamu bagikan sendiri. Untuk kirim lewat email: isi <span class="mono">RESEND_API_KEY</span> dan <span class="mono">MAIL_FROM</span> di <span class="mono">deploy/studio/.env</span>.</span></div>`}
    <div class="fld"><span class="lb">Undang lewat email</span>
      <div class="meta-row" style="gap:10px;align-items:center"><input type="text" id="invEmail" inputmode="email" autocomplete="off" placeholder="nama@contoh.com" style="flex:1;min-width:220px">${roleSel('id="invRole"', "editor")}<button class="btn pri" id="invGo">Kirim undangan</button></div>
      <span class="hint">Link sekali pakai, berlaku ${d.hours} jam. Penerima membuat password sendiri. ${d.roles.map((x) => `<b>${ROLE_LB[x]}</b>: ${ROLE_HINT[x]}`).join(" · ")}.</span>
      <div id="invOut"></div></div>
    <div class="grp-h"><h2>Akun</h2><small>${d.users.length + (d.owner ? 1 : 0)} akun</small></div>
    ${d.owner ? row(`<b>${esc(d.owner)}</b><span class="pill acc">Pemilik</span><span class="muted" style="font-size:12px">password lama relay</span>`) : ""}
    ${d.users.map((u) => row(`<b>${esc(u.email)}</b><span>${esc(u.name || "")}</span>${u.status === "revoked" ? `<span class="pill" style="color:var(--bad)">dicabut</span>` : ""}<span class="muted" style="font-size:12px">masuk terakhir ${when(u.lastLogin)}</span>`,
      u.email === d.me ? `<span class="pill">${ROLE_LB[u.role]} · kamu</span>` : `${roleSel(`data-role="${esc(u.email)}"`, u.role)}<button class="btn sm" data-st="${esc(u.email)}" data-to="${u.status === "revoked" ? "restore" : "revoke"}">${u.status === "revoked" ? "Pulihkan" : "Cabut"}</button><button class="btn sm" data-udel="${esc(u.email)}">Hapus</button>`)).join("") || `<p class="muted" style="font-size:13px">Belum ada user undangan.</p>`}
    <div class="grp-h" style="margin-top:22px"><h2>Undangan terbuka</h2><small>${d.invites.length}</small></div>
    ${d.invites.map((i) => row(`<b>${esc(i.email)}</b><span class="pill">${ROLE_LB[i.role]}</span>${i.expired ? `<span class="pill" style="color:var(--bad)">kedaluwarsa</span>` : `<span class="muted" style="font-size:12px">berlaku sampai ${when(i.exp)}</span>`}<span class="muted" style="font-size:12px">${i.sent ? "email terkirim" : "email tidak terkirim"}</span>`,
      `<button class="btn sm" data-re="${esc(i.email)}" data-rerole="${i.role}">Kirim ulang</button><button class="btn sm" data-cancel="${i.id}">Batalkan</button>`)).join("") || `<p class="muted" style="font-size:13px">Tidak ada.</p>`}`;
  const call = async (method, path, body) => {
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, ...(body ? { body: JSON.stringify(body) } : {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `gagal (${r.status})`);
    return j;
  };
  const invite = async (email, role) => {
    try {
      const j = await call("POST", "/api/users/invite", { email, role });
      await viewUsers();
      $("#invOut").innerHTML = `<div class="notice" style="margin:10px 0 0"><span>${j.sent ? `Undangan terkirim ke <b>${esc(j.email)}</b>.` : `<b>Email tidak terkirim.</b> ${esc(j.note || "")}`} Link (sekali pakai): <span class="mono" style="word-break:break-all">${esc(j.link)}</span></span><button class="btn sm" id="invCopy">Salin link</button></div>`;
      $("#invCopy").onclick = () => toast(copyText(j.link) ? "Link undangan tersalin" : "Browser menolak menyalin. Salin manual.");
    } catch (e) { toast(e.message); }
  };
  $("#invGo").onclick = () => { const e = $("#invEmail").value.trim(); if (e) invite(e, $("#invRole").value); };
  $("#invEmail").onkeydown = (e) => e.key === "Enter" && $("#invGo").click();
  const act = (fn) => async (ev) => { try { await fn(ev.currentTarget); await viewUsers(); } catch (e) { toast(e.message); } };
  const u = (b, k) => encodeURIComponent(b.dataset[k]);
  document.querySelectorAll("[data-role]").forEach((s) => (s.onchange = act((b) => call("POST", `/api/users/${u(b, "role")}/role`, { role: b.value }))));
  document.querySelectorAll("[data-st]").forEach((b) => (b.onclick = act((b) => call("POST", `/api/users/${u(b, "st")}/${b.dataset.to}`))));
  document.querySelectorAll("[data-udel]").forEach((b) => (b.onclick = act((b) => confirm(`Hapus akun ${b.dataset.udel}? Ia harus diundang lagi untuk masuk.`) && call("DELETE", `/api/users/${u(b, "udel")}`))));
  document.querySelectorAll("[data-cancel]").forEach((b) => (b.onclick = act((b) => call("DELETE", `/api/users/invite/${b.dataset.cancel}`))));
  document.querySelectorAll("[data-re]").forEach((b) => (b.onclick = () => invite(b.dataset.re, b.dataset.rerole)));
}

async function route() {
  await loadVideos();
  const h = location.hash || "#/";
  const m = h.match(/^#\/v\/([a-z0-9-]+)/);
  document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === (h.startsWith("#/baru") || h.startsWith("#/tambah") ? "baru" : h.startsWith("#/user") ? "user" : h.startsWith("#/sampah") ? "sampah" : m || h.startsWith("#/s/") ? "" : "home")));
  window.scrollTo(0, 0);
  if (m) return viewEditor(m[1]);
  // old links (#/baru/musafo, #/baru/berakitkehulu) are Storytelling channels now
  const old = h.match(/^#\/baru\/(musafo|berakitkehulu)$/);
  if (old) return void (location.hash = `#/baru/storytelling/${old[1]}`);
  const add = h.match(/^#\/tambah\/([\w-]+)/);
  if (add && catOf(add[1])) return viewAddSub(catOf(add[1]));
  if (h.startsWith("#/baru")) {
    const [, , catId, subId] = h.split("/");
    const cat = catOf(catId), sub = cat?.subs.find((s) => s.id === subId);
    if (!sub) return viewPick(cat?.id);
    if (sub.draft) return viewDraft(cat, sub);
    return cat.id === "storytelling" ? viewNewMusafo(sub.id) : cat.id === "explainer" ? viewNew(sub.id) : cat.id === "cinematic" ? viewNewCinematic(sub.id) : cat.id === "cinemaclone" ? viewNewClone(sub.id) : cat.id === "animation" ? viewNewAnimation(sub.id) : viewNewAd(sub.id);
  }
  // #/s/<category>/<sub>[/footage | /cerita[/<book>]]: the page of one preset / channel / product
  const sp = h.match(/^#\/s\/([\w-]+)\/([\w-]+)(?:\/(\w+))?(?:\/([\w-]+))?/);
  const spCat = sp && catOf(sp[1]), spSub = spCat?.subs.find((s) => s.id === sp[2]);
  if (spSub) return viewSub(spCat, spSub, sp[3], sp[4]);
  // old links: Library Cerita per channel → that channel's page; #/library → the whole footage library
  const oc = h.match(/^#\/cerita(?:\/([\w-]+))?(?:\/([\w-]+))?/);
  if (oc) return void (location.hash = `#/s/storytelling/${oc[1] || catOf("storytelling").subs[0].id}/cerita${oc[2] ? "/" + oc[2] : ""}`);
  if (h.startsWith("#/library")) return viewLibrary();
  if (h.startsWith("#/user")) return viewUsers();
  if (h.startsWith("#/sampah")) return viewTrash();
  viewHome();
}
window.onhashchange = route;
route();

// ---------- Chat panel (user 2026-11-13): Claude Code headless on the laptop (tools/studio-chat.mjs) ----------
// Local Studio = the owner; through the web relay admins only. Polls /api/chat (fast while Claude works).
const chat = { open: false, timer: null, last: "", busy: false };
const chatMd = (t) => esc(t)
  .replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => `<code style="display:block;white-space:pre-wrap">${c}</code>`)
  .replace(/`([^`\n]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
// which page the user is on, so "this video" means something to Claude
const chatContext = () => {
  const h = location.hash, m = h.match(/^#\/v\/([\w-]+)(?:\/([\w-]+))?/);
  if (m) { const v = videos.find((x) => x.slug === m[1]); return `editor video ${m[1]}${v ? ` ("${v.title}", tahap ${v.next})` : ""}${m[2] ? `, tab ${m[2]}` : ""}`; }
  const s = h.match(/^#\/s\/([\w-]+)\/([\w-]+)/);
  if (s) return `halaman sub ${s[1]}/${s[2]}`;
  return h && h !== "#/" ? `halaman ${h.slice(2)}` : "";
};
function chatRender(st) {
  chat.busy = st.running || st.queued.length > 0;
  $("#chatFab").classList.toggle("busy", chat.busy);
  $("#chatStop").hidden = !chat.busy;
  const since = st.startedAt ? Math.round((Date.now() - Date.parse(st.startedAt)) / 1000) : 0;
  $("#chatWork").textContent = st.running ? `Claude sedang bekerja… ${since}s${st.queued.length ? ` · ${st.queued.length} pesan antre` : ""}` : "";
  const key = st.messages.length + "|" + (st.messages.at(-1)?.at ?? "");
  if (key === chat.last) return;
  chat.last = key;
  const log = $("#chatLog"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.innerHTML = st.messages.length ? st.messages.map((m) => `<div class="chat-m ${m.role}">${m.role === "assistant" ? chatMd(m.text) : esc(m.text)}</div>`).join("")
    : `<div class="chat-empty"><b>Ngobrol dengan Claude dari sini.</b><br>Claude jalan di laptop, di folder TERTORTOR LITE, dan membaca CLAUDE.md yang sama. Kalau kamu sedang membuka satu video, Claude tahu video yang mana.<br><br>Edit file dan perintah npm/node boleh. Commit, push, kirim ke Buffer, dan publish tetap minta izinmu dulu.</div>`;
  if (atEnd || st.running) log.scrollTop = log.scrollHeight;
}
async function chatPoll() {
  clearTimeout(chat.timer);
  try { const r = await fetch("/api/chat"); if (r.ok) chatRender(await r.json()); } catch {}
  if (chat.open || chat.busy) chat.timer = setTimeout(chatPoll, chat.busy ? 1500 : 8000);
}
const chatPost = async (path, body) => {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  chatRender(j); chatPoll();
};
function chatToggle(open = !chat.open) {
  chat.open = open;
  $("#chat").classList.toggle("open", open); $("#chat").setAttribute("aria-hidden", String(!open));
  $("#chatFab").hidden = open;
  if (open) { chat.last = ""; chatPoll(); setTimeout(() => $("#chatIn").focus(), 150); }
}
meReady.then(() => {
  if (me && me.role !== "admin") return; // chat = Claude on the laptop: owner and admins only
  $("#chatFab").hidden = false;
  $("#chatFab").onclick = () => chatToggle(true);
  $("#chatX").onclick = () => chatToggle(false);
  $("#chatStop").onclick = () => chatPost("/api/chat/stop").catch((e) => toast(e.message));
  $("#chatNew").onclick = () => { if (confirm("Mulai percakapan baru? Riwayat yang sekarang diarsipkan.")) chatPost("/api/chat/new").catch((e) => toast(e.message)); };
  const inp = $("#chatIn");
  inp.oninput = () => { inp.style.height = "auto"; inp.style.height = Math.min(160, inp.scrollHeight) + "px"; };
  inp.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#chatF").requestSubmit(); } };
  $("#chatF").onsubmit = async (e) => {
    e.preventDefault();
    const text = inp.value.trim(); if (!text) return;
    inp.value = ""; inp.oninput();
    try { await chatPost("/api/chat", { text, context: chatContext() }); } catch (err) { inp.value = text; toast("Gagal kirim: " + err.message); }
  };
  chatPoll(); // shows the green dot if Claude is still working from an earlier message
});
